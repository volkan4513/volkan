<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Windows 98 Desktop</title>
  <style>
    :root {
      --vignette-opacity: 0.3; /* adjust this for darkness */
      --tv-ratio: 1.5;         /* monitor_03.webp is 1536x1024 */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* the TV is scaled to fit the viewport, keeping its aspect ratio */
    .tv {
      position: relative;
      width: min(100vw, 100vh * var(--tv-ratio));
      width: min(100vw, 100dvh * var(--tv-ratio));
      aspect-ratio: 1536 / 1024;
    }

    .tv img {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .screen {
      position: absolute;
      top: 11%;
      left: 24.7%;
      width: 51.25%;
      height: 53.25%;
      overflow: hidden;
      border-radius: 8px;
    }

    .screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      border-radius: 8px;
    }

    /* vignette overlay (corners + top + bottom fade) */
    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none; /* keeps iframe clickable */
      background: radial-gradient(circle at center,
                  rgba(0,0,0,0) 70%,
                  rgba(0,0,0,var(--vignette-opacity)) 100%),
                  linear-gradient(to top, rgba(0,0,0,var(--vignette-opacity)) 0%, rgba(0,0,0,0) 10%),
                  linear-gradient(to bottom, rgba(0,0,0,var(--vignette-opacity)) 0%, rgba(0,0,0,0) 10%);
      background-blend-mode: multiply;
    }

    /* Phones / narrow portrait screens: the TV's screen would be tiny, so the
       desktop goes full screen inside a thin CRT bezel instead. */
    @media (max-width: 760px), (orientation: portrait) and (max-width: 1100px), (max-height: 480px) {
      .tv {
        position: fixed;
        inset: 0;
        width: auto;
        aspect-ratio: auto;
        padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 6px max(6px, env(safe-area-inset-left));
        background: #1b1b1b;
      }

      .tv img { display: none; }

      .screen {
        position: relative;
        inset: auto;
        width: 100%;
        height: 100%;
        border-radius: 14px;
        box-shadow: 0 0 0 3px #000, 0 0 0 5px #3a3a3a;
      }

      .screen iframe { border-radius: 14px; }

      /* the desktop has its own "Back to Portfolio" icon and Start entry */
      .site-home-btn { display: none !important; }
    }
  </style>
</head>
<body>
  <script src="../../pixel-transition.js"></script>
  <script>PixelTransition.reveal();</script>
  <script src="../../site-nav.js" data-home="../../index.html"></script>

  <div class="tv">
    <!-- TV frame -->
    <img src="page_images/monitor_03.webp" alt="" aria-hidden="true">

    <!-- the screen area -->
    <div class="screen">
      <iframe src="windows98.html" title="Windows 98 desktop" allow="autoplay; fullscreen"></iframe>
    </div>
  </div>
</body>
</html>
