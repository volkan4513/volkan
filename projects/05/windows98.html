<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Windows 98</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --surface: #c0c0c0;
            --text: #222;
            --highlight: #fff;
            --shadow: #808080;
            --frame: #0a0a0a;
            --blue: #000080;
            --blue-light: #1084d0;
            --raised: inset -1px -1px var(--frame), inset 1px 1px var(--highlight), inset -2px -2px var(--shadow), inset 2px 2px #dfdfdf;
            --sunken: inset -1px -1px var(--highlight), inset 1px 1px var(--frame), inset -2px -2px #dfdfdf, inset 2px 2px var(--shadow);
            --win: inset -1px -1px var(--frame), inset 1px 1px #dfdfdf, inset -2px -2px var(--shadow), inset 2px 2px var(--highlight);
            --field: inset -1px -1px var(--highlight), inset 1px 1px var(--shadow), inset -2px -2px #dfdfdf, inset 2px 2px var(--frame);
            --ui-font: Tahoma, 'MS Sans Serif', Geneva, Verdana, Arial, sans-serif;
            --mono: 'VT323', 'Courier New', monospace;
            --taskbar-h: 30px;
            --wallpaper: #008080;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            font: 12px/1.3 var(--ui-font);
            -webkit-font-smoothing: none;
            color: var(--text);
            background: #000;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        img.px {
            image-rendering: pixelated;
        }

        /* ---------- controls ---------- */
        button.w98,
        .w98-btn {
            font: inherit;
            color: var(--text);
            background: var(--surface);
            border: none;
            box-shadow: var(--raised);
            min-width: 75px;
            min-height: 23px;
            padding: 0 12px;
            cursor: default;
        }

        button.w98:active:not(:disabled) {
            box-shadow: var(--sunken);
            padding: 1px 11px 0 13px;
        }

        button.w98:focus-visible {
            outline: 1px dotted var(--frame);
            outline-offset: -4px;
        }

        button.w98:disabled {
            color: var(--shadow);
            text-shadow: 1px 1px 0 var(--highlight);
        }

        input.w98,
        select.w98,
        textarea.w98 {
            font: inherit;
            background: #fff;
            border: none;
            box-shadow: var(--field);
            padding: 3px 4px;
            outline: none;
            border-radius: 0;
            user-select: text;
            -webkit-user-select: text;
        }

        input[type=range].w98 {
            box-shadow: none;
            background: transparent;
            padding: 0;
        }

        .field-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        fieldset.w98 {
            border: none;
            box-shadow: var(--sunken);
            padding: 10px;
            margin: 0 0 10px;
        }

        fieldset.w98 legend {
            padding: 0 3px;
            background: var(--surface);
        }

        /* ---------- desktop ---------- */
        .desktop {
            position: relative;
            flex: 1;
            min-height: 0;
            background: var(--wallpaper);
            background-size: auto;
            image-rendering: pixelated;
            overflow: hidden;
        }

        .icons {
            position: absolute;
            inset: 0;
            padding: 8px 4px;
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(auto-fill, 74px);
            grid-auto-columns: 78px;
            gap: 4px 2px;
            align-content: start;
            justify-content: start;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 2px;
            color: #fff;
            text-align: center;
            cursor: default;
            outline: none;
            border: none;
            background: none;
            font: inherit;
        }

        .desktop-icon img {
            width: 32px;
            height: 32px;
        }

        .desktop-icon span {
            padding: 1px 2px;
            line-height: 1.2;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.6);
            overflow-wrap: anywhere;
        }

        .desktop-icon.selected img {
            filter: brightness(0.55) sepia(1) hue-rotate(190deg) saturate(4);
        }

        .desktop-icon.selected span {
            background: var(--blue);
            text-shadow: none;
            outline: 1px dotted #ff0;
        }

        /* ---------- windows ---------- */
        .window {
            position: absolute;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            box-shadow: var(--win);
            padding: 3px;
            min-width: 200px;
            min-height: 120px;
        }

        .window.maximized {
            left: 0 !important;
            top: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }

        .window.opening {
            animation: win-open 0.16s steps(4);
        }

        .window.closing {
            animation: win-open 0.12s steps(3) reverse forwards;
        }

        @keyframes win-open {
            from {
                transform: scale(0.3);
                opacity: 0;
            }
        }

        .title-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 2px 2px 3px;
            background: linear-gradient(90deg, #808080, #b5b5b5);
            color: #dcdcdc;
            font-weight: bold;
            touch-action: none;
        }

        .window.active .title-bar {
            background: linear-gradient(90deg, var(--blue), var(--blue-light));
            color: #fff;
        }

        .title-bar img {
            width: 16px;
            height: 16px;
        }

        .title-bar-text {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .title-bar-controls {
            display: flex;
            gap: 2px;
        }

        .title-bar-controls button {
            min-width: 16px;
            min-height: 14px;
            width: 16px;
            height: 14px;
            padding: 0;
            display: grid;
            place-items: center;
            background: var(--surface);
            border: none;
            box-shadow: var(--raised);
        }

        .title-bar-controls button:active {
            box-shadow: var(--sunken);
        }

        .title-bar-controls svg {
            stroke: #000;
            stroke-width: 1.6;
            fill: none;
        }

        .menu-bar {
            display: flex;
            flex-wrap: wrap;
            padding: 1px 0;
        }

        .menu-bar>.menu {
            position: relative;
        }

        .menu-bar>.menu>button {
            font: inherit;
            border: none;
            background: none;
            padding: 3px 7px;
        }

        .menu-bar>.menu.open>button {
            box-shadow: var(--sunken);
        }

        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 5;
            min-width: 150px;
            padding: 2px;
            background: var(--surface);
            box-shadow: var(--raised);
            display: none;
        }

        .menu.open>.dropdown {
            display: block;
        }

        .dropdown button,
        .ctx-menu button {
            display: flex;
            width: 100%;
            justify-content: space-between;
            gap: 20px;
            font: inherit;
            text-align: left;
            border: none;
            background: none;
            padding: 4px 18px;
            white-space: nowrap;
        }

        .dropdown button:hover,
        .ctx-menu button:hover {
            background: var(--blue);
            color: #fff;
        }

        .dropdown hr,
        .ctx-menu hr {
            border: none;
            border-top: 1px solid var(--shadow);
            border-bottom: 1px solid var(--highlight);
            margin: 3px 2px;
        }

        .dropdown button.checked::before {
            content: '\2713';
            position: absolute;
            margin-left: -13px;
        }

        .window-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            margin: 2px 0 0;
            position: relative;
        }

        .sunken-panel {
            background: #fff;
            box-shadow: var(--field);
            padding: 2px;
            overflow: auto;
            flex: 1;
            min-height: 0;
        }

        .window-body iframe {
            flex: 1;
            width: 100%;
            min-height: 0;
            border: none;
            background: #fff;
            box-shadow: var(--field);
            padding: 2px;
        }

        .status-bar {
            display: flex;
            gap: 2px;
            margin-top: 2px;
        }

        .status-bar>div {
            flex: 1;
            box-shadow: inset -1px -1px #dfdfdf, inset 1px 1px var(--shadow);
            padding: 2px 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 16px;
            height: 16px;
            cursor: nwse-resize;
            touch-action: none;
            background:
                linear-gradient(135deg, transparent 0 55%, var(--shadow) 55% 62%, transparent 62% 70%, var(--shadow) 70% 77%, transparent 77% 85%, var(--shadow) 85% 92%, transparent 92%);
        }

        .window.maximized .resize-handle,
        body.small .resize-handle {
            display: none;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 3px;
            padding: 2px 0 4px;
        }

        .toolbar button.w98 {
            min-width: 0;
            padding: 0 8px;
        }

        .toolbar .w98.grow {
            flex: 1;
            min-width: 80px;
        }

        /* ---------- folder view ---------- */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            gap: 6px;
            align-content: start;
            padding: 6px;
        }

        .folder-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 4px 2px;
            border: none;
            background: none;
            font: inherit;
            text-align: center;
        }

        .folder-item img {
            width: 32px;
            height: 32px;
        }

        .folder-item.selected span {
            background: var(--blue);
            color: #fff;
            outline: 1px dotted #ff0;
        }

        /* ---------- taskbar ---------- */
        .taskbar {
            height: calc(var(--taskbar-h) + env(safe-area-inset-bottom));
            padding: 2px 2px env(safe-area-inset-bottom);
            display: flex;
            align-items: center;
            gap: 3px;
            background: var(--surface);
            box-shadow: inset 0 1px #dfdfdf, inset 0 2px var(--highlight);
            position: relative;
            z-index: 9000;
        }

        .start-button {
            font: bold 12px var(--ui-font);
            display: flex;
            align-items: center;
            gap: 4px;
            height: 24px;
            padding: 0 6px 0 4px;
            border: none;
            background: var(--surface);
            box-shadow: var(--raised);
            flex: none;
        }

        .start-button.open {
            box-shadow: var(--sunken);
        }

        .start-button img {
            width: 16px;
            height: 16px;
        }

        .taskbar-sep {
            width: 2px;
            height: 22px;
            border-left: 1px solid var(--shadow);
            border-right: 1px solid var(--highlight);
            flex: none;
        }

        .quick-launch {
            display: flex;
            gap: 1px;
            flex: none;
        }

        .quick-launch button {
            width: 24px;
            height: 22px;
            padding: 0;
            display: grid;
            place-items: center;
            border: none;
            background: none;
        }

        .quick-launch button:active {
            box-shadow: var(--sunken);
        }

        .quick-launch img {
            width: 16px;
            height: 16px;
        }

        .tasks {
            flex: 1;
            min-width: 0;
            display: flex;
            gap: 3px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tasks::-webkit-scrollbar {
            display: none;
        }

        .task-btn {
            font: inherit;
            flex: 0 1 150px;
            min-width: 40px;
            height: 24px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 5px;
            border: none;
            background: var(--surface);
            box-shadow: var(--raised);
            text-align: left;
            overflow: hidden;
        }

        .task-btn span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-btn img {
            width: 16px;
            height: 16px;
            flex: none;
        }

        .task-btn.active {
            box-shadow: var(--sunken);
            font-weight: bold;
            background: repeating-conic-gradient(#fff 0 25%, var(--surface) 0 50%) 0 0 / 2px 2px;
        }

        .tray {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 24px;
            padding: 0 8px;
            box-shadow: inset -1px -1px var(--highlight), inset 1px 1px var(--shadow);
            flex: none;
        }

        .tray img {
            width: 16px;
            height: 16px;
        }

        .clock {
            font-family: var(--mono);
            font-size: 16px;
        }

        /* ---------- start menu ---------- */
        .start-menu {
            position: absolute;
            left: 2px;
            bottom: calc(var(--taskbar-h) + env(safe-area-inset-bottom) - 2px);
            z-index: 9100;
            display: none;
            background: var(--surface);
            box-shadow: var(--raised);
            padding: 3px;
            max-height: calc(100% - 40px);
        }

        .start-menu.open {
            display: flex;
            animation: slide-up 0.12s steps(3);
        }

        @keyframes slide-up {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
        }

        .start-banner {
            width: 22px;
            background: linear-gradient(0deg, var(--blue), var(--blue-light));
            color: #c0c0c0;
            font: bold 16px/1 var(--ui-font);
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            padding: 6px 2px;
            white-space: nowrap;
        }

        .start-banner b {
            color: #fff;
        }

        .start-items {
            display: flex;
            flex-direction: column;
            min-width: 190px;
            overflow-y: auto;
        }

        .start-items button,
        .submenu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            font: inherit;
            text-align: left;
            border: none;
            background: none;
            padding: 5px 22px 5px 6px;
            position: relative;
            white-space: nowrap;
        }

        .start-items>button img,
        .start-items>.has-sub>button img {
            width: 24px;
            height: 24px;
        }

        .submenu button img {
            width: 16px;
            height: 16px;
        }

        .start-items button:hover,
        .submenu button:hover,
        .has-sub.open>button {
            background: var(--blue);
            color: #fff;
        }

        .has-sub {
            position: relative;
        }

        .has-sub>button::after {
            content: '\25B6';
            position: absolute;
            right: 6px;
            font-size: 8px;
        }

        .submenu {
            position: absolute;
            left: 100%;
            bottom: -3px;
            min-width: 180px;
            padding: 2px;
            background: var(--surface);
            box-shadow: var(--raised);
            display: none;
        }

        .has-sub.open>.submenu {
            display: block;
        }

        .start-items hr {
            border: none;
            border-top: 1px solid var(--shadow);
            border-bottom: 1px solid var(--highlight);
            margin: 3px 2px;
            width: calc(100% - 4px);
        }

        /* ---------- context menu ---------- */
        .ctx-menu {
            position: absolute;
            z-index: 9200;
            min-width: 160px;
            padding: 2px;
            background: var(--surface);
            box-shadow: var(--raised);
            display: none;
        }

        .ctx-menu.open {
            display: block;
        }

        /* ---------- message box ---------- */
        .msg-body {
            display: flex;
            gap: 14px;
            padding: 12px 10px 6px;
            align-items: flex-start;
        }

        .msg-body img {
            width: 32px;
            height: 32px;
            flex: none;
        }

        .msg-text {
            white-space: pre-wrap;
            padding-top: 6px;
            max-width: 340px;
        }

        .msg-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 8px 0 6px;
        }

        /* ---------- notepad ---------- */
        .notepad textarea {
            flex: 1;
            resize: none;
            font: 18px/1.1 var(--mono);
            white-space: pre-wrap;
        }

        .notepad textarea.nowrap {
            white-space: pre;
            overflow-x: auto;
        }

        /* ---------- minesweeper ---------- */
        .mines {
            align-items: center;
            padding: 4px;
            box-shadow: var(--raised);
            background: var(--surface);
        }

        .mines-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            width: 100%;
            padding: 4px 5px;
            margin-bottom: 6px;
            box-shadow: var(--sunken);
        }

        .lcd {
            font: 28px/1 var(--mono);
            color: #f00;
            background: #000;
            padding: 0 4px;
            min-width: 46px;
            text-align: right;
            letter-spacing: 1px;
        }

        .face {
            width: 30px;
            height: 30px;
            min-width: 30px !important;
            padding: 0 !important;
            font-size: 18px !important;
            line-height: 1;
        }

        .flag-mode {
            min-width: 0 !important;
            padding: 0 6px !important;
        }

        .flag-mode.on {
            box-shadow: var(--sunken) !important;
            background: #ffffa0 !important;
        }

        .mine-grid {
            display: grid;
            box-shadow: var(--sunken);
            padding: 3px;
            touch-action: manipulation;
        }

        .cell {
            width: var(--cs);
            height: var(--cs);
            padding: 0;
            border: none;
            background: var(--surface);
            box-shadow: var(--raised);
            font: bold calc(var(--cs) * 0.62)/1 var(--ui-font);
            display: grid;
            place-items: center;
        }

        .cell.open {
            box-shadow: none;
            border-right: 1px solid var(--shadow);
            border-bottom: 1px solid var(--shadow);
        }

        .cell.boom {
            background: #f00;
        }

        .n1 { color: #0000ff; }
        .n2 { color: #008000; }
        .n3 { color: #ff0000; }
        .n4 { color: #000080; }
        .n5 { color: #800000; }
        .n6 { color: #008080; }
        .n7 { color: #000; }
        .n8 { color: #808080; }

        /* ---------- explorer ---------- */
        .address {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 0 4px;
        }

        .address input {
            flex: 1;
            min-width: 0;
        }

        .infobar {
            background: #ffffe1;
            border-bottom: 1px solid #808080;
            padding: 4px 8px;
            display: none;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .infobar.show {
            display: flex;
        }

        .infobar a {
            color: #00f;
        }

        /* ---------- DOS prompt ---------- */
        .dos {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            background: #000;
            color: #c0c0c0;
            font: 19px/1.05 var(--mono);
            padding: 4px 6px;
            white-space: pre-wrap;
            word-break: break-word;
            user-select: text;
            -webkit-user-select: text;
        }

        .dos-line {
            display: flex;
        }

        .dos input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: inherit;
            font: inherit;
            padding: 0;
            caret-color: currentColor;
        }

        /* ---------- media player ---------- */
        .amp {
            background: #232338;
            color: #00e000;
            padding: 6px;
            gap: 6px;
            box-shadow: var(--sunken);
        }

        .amp-display {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 6px;
            background: #000;
            box-shadow: inset 1px 1px #000, inset -1px -1px #555;
            padding: 6px;
        }

        .amp-time {
            font: 34px/1 var(--mono);
            color: #00ff00;
            text-shadow: 0 0 6px rgba(0, 255, 0, 0.5);
        }

        .amp-marquee {
            overflow: hidden;
            white-space: nowrap;
            font: 18px/1.2 var(--mono);
        }

        .amp-marquee span {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            to {
                transform: translateX(-100%);
            }
        }

        .amp-meta {
            font: 14px var(--mono);
            color: #00a000;
        }

        .amp canvas {
            grid-column: 1 / -1;
            width: 100%;
            height: 38px;
            image-rendering: pixelated;
        }

        .amp-buttons {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            align-items: center;
        }

        .amp-buttons button.w98 {
            min-width: 30px;
            padding: 0 6px;
            font-size: 13px;
        }

        .amp-buttons label {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 4px;
            font: 14px var(--mono);
        }

        .amp-list {
            flex: 1;
            min-height: 60px;
            overflow-y: auto;
            background: #000;
            box-shadow: inset 1px 1px #000, inset -1px -1px #555;
            font: 17px/1.3 var(--mono);
            padding: 2px;
        }

        .amp-list button {
            display: block;
            width: 100%;
            text-align: left;
            border: none;
            background: none;
            color: #00e000;
            font: inherit;
            padding: 1px 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .amp-list button.playing {
            color: #fff;
            background: #0000c6;
        }

        /* ---------- display properties ---------- */
        .wall-preview {
            height: 90px;
            margin: 0 auto 10px;
            width: 140px;
            box-shadow: 0 0 0 6px #c0c0c0, 0 0 0 7px #000, 0 0 0 10px #777;
            background: var(--wallpaper);
            image-rendering: pixelated;
        }

        .wall-list {
            height: 110px;
            overflow-y: auto;
            background: #fff;
            box-shadow: var(--field);
            padding: 2px;
        }

        .wall-list button {
            display: block;
            width: 100%;
            text-align: left;
            font: inherit;
            border: none;
            background: none;
            padding: 2px 4px;
        }

        .wall-list button.sel {
            background: var(--blue);
            color: #fff;
        }

        /* ---------- boot / shutdown / screensaver ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 24px;
            background: #000;
            color: #c0c0c0;
        }

        .overlay.hidden {
            display: none;
        }

        .boot-text {
            font: 22px var(--mono);
            align-self: flex-start;
            margin: 16px;
            position: absolute;
            top: 0;
            left: 0;
            white-space: pre;
        }

        .boot-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            font: italic bold clamp(22px, 6vw, 40px) var(--ui-font);
            color: #fff;
            opacity: 0;
        }

        .boot-logo img {
            width: clamp(48px, 12vw, 80px);
            height: auto;
        }

        .boot-logo sup {
            font-size: 0.5em;
            color: #ffb000;
        }

        .boot-bar {
            width: min(300px, 70vw);
            height: 10px;
            background: linear-gradient(90deg, #000 0 20%, #2050ff 30%, #60a0ff 40%, #000 50%, #000 70%, #2050ff 80%, #60a0ff 90%, #000 100%);
            background-size: 200% 100%;
            animation: boot-bar 1s linear infinite;
            opacity: 0;
        }

        @keyframes boot-bar {
            to {
                background-position: -200% 0;
            }
        }

        .overlay.logo .boot-logo,
        .overlay.logo .boot-bar {
            opacity: 1;
        }

        .overlay.logo .boot-text {
            display: none;
        }

        .safe-text {
            font: clamp(20px, 5vw, 34px)/1.3 var(--mono);
            color: #ff8c00;
            text-align: center;
            padding: 20px;
        }

        .safe-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #screensaver {
            position: fixed;
            inset: 0;
            z-index: 9900;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            cursor: none;
        }

        /* ---------- touch / small screens ---------- */
        @media (pointer: coarse) {
            .title-bar-controls button {
                width: 26px;
                height: 22px;
            }

            .title-bar {
                padding: 3px;
            }

            .dropdown button,
            .ctx-menu button,
            .start-items button,
            .submenu button {
                padding-top: 9px;
                padding-bottom: 9px;
            }

            :root {
                --taskbar-h: 36px;
            }

            .start-button,
            .task-btn,
            .tray {
                height: 30px;
            }
        }

        body.small .window {
            min-width: 0;
        }

        body.small .start-items {
            min-width: 170px;
        }

        /* submenus open inline on narrow screens so nothing runs off-screen */
        body.small .submenu {
            position: static;
            box-shadow: none;
            padding-left: 18px;
            background: transparent;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

        const ICONS = {};

            c.width = c.height = 16;
            const g = c.getContext('2d');
            rows.forEach((row, y) => [...row.padEnd(16, '.')].slice(0, 16).forEach((ch, x) => {
                if (PAL[ch]) { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); }
            }));
            ICONS[name] = c.toDataURL();
        }
        const iconUrl = name => ICONS[name] || ICONS.exe;
        const hydrateIcons = root => root.querySelectorAll('img[data-icon]').forEach(img => {
            img.src = iconUrl(img.dataset.icon);

        hydrateIcons(document);

        // ======================================================================
        // Helpers
        // ======================================================================
        const $ = id => document.getElementById(id);
        const desktop = $('desktop');
        const isTouchEvent = e => e.pointerType === 'touch' || e.pointerType === 'pen';
        const el = (tag, props = {}, ...kids) => {
            const n = document.createElement(tag);
            for (const [k, v] of Object.entries(props)) {
                if (k === 'class') n.className = v;
                else if (k === 'style') n.style.cssText = v;
                else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
                else if (k === 'html') n.innerHTML = v;
                else n.setAttribute(k, v);
            }
            kids.flat().forEach(kid => kid != null && n.append(kid));
            return n;
        };
        const store = {
            get(k, d) { try { const v = localStorage.getItem('w98.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },

        const isSmall = () => desktop.clientWidth < 640 || desktop.clientHeight < 420;
        function updateSmall() { document.body.classList.toggle('small', isSmall()); }

        // Navigate the top-level page (this desktop usually lives in an iframe).
        function goTop(url) {
            const abs = new URL(url, location.href).href;
            try {
                if (window.top.PixelTransition) window.top.PixelTransition.go(abs);
                else window.top.location.href = abs;
            } catch {
                location.href = abs;
            }
        }

        // Single tap opens on touch screens; mouse users double-click, like 98.
        let lastTouchOpen = 0;
        function bindOpen(node, open) {
            node.addEventListener('pointerup', e => {
                if (e.button > 0 || !isTouchEvent(e)) return;
                lastTouchOpen = Date.now();
                open();
            });
            // a double-tap also fires dblclick — ignore it right after a touch open
            node.addEventListener('dblclick', () => { if (Date.now() - lastTouchOpen > 700) open(); });
            node.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });

        // ======================================================================
        // Window manager

        let zTop = 10;
        const windows = new Set();
        let activeWin = null;

        function focusWin(w) {
            if (!w) return;
            if (w.minimized) restoreWin(w);
            w.el.style.zIndex = ++zTop;
            if (activeWin && activeWin !== w) activeWin.el.classList.remove('active');
            activeWin = w;
            w.el.classList.add('active');
            renderTasks();
        }

        function blurAll() {
            if (activeWin) activeWin.el.classList.remove('active');
            activeWin = null;
            renderTasks();
        }

        function topmostVisible(except) {
            let best = null;
            windows.forEach(w => {
                if (w === except || w.minimized) return;
                if (!best || +w.el.style.zIndex > +best.el.style.zIndex) best = w;
            });
            return best;
        }

        function minimizeWin(w) {
            w.minimized = true;
            w.el.style.display = 'none';
            if (activeWin === w) {
                w.el.classList.remove('active');
                activeWin = null;
                focusWin(topmostVisible(w));
            }
            renderTasks();
        }

        function restoreWin(w) {
            w.minimized = false;
            w.el.style.display = 'flex';

            if (isSmall() || w.fixedSize) return;
            w.el.classList.toggle('maximized');
            w.onResize?.();

            if (!windows.has(w)) return;
            w.onClose?.();
            windows.delete(w);
            w.el.classList.add('closing');
            setTimeout(() => w.el.remove(), 120);
            if (activeWin === w) {

                focusWin(topmostVisible(w));

            renderTasks();

        const CONTROL_SVG = {
            min: '<svg width="8" height="8"><path d="M0 7H6"/></svg>',

        // opts: { title, icon, width, height, body(node, win), menu, status, fixedSize, appId }
        function createWindow(opts) {
            const w = { ...opts, minimized: false };
            const node = el('div', { class: 'window opening', role: 'dialog', 'aria-label': opts.title });
            const titleText = el('span', { class: 'title-bar-text' }, opts.title);

            controls.append(el('button', { 'aria-label': 'Close', html: CONTROL_SVG.close, onclick: e => { e.stopPropagation(); closeWin(w); } }));
            const titleBar = el('div', { class: 'title-bar' }, el('img', { class: 'px', src: iconUrl(opts.icon), alt: '' }), titleText, controls);
            node.append(titleBar);

            if (opts.menu) node.append(buildMenuBar(opts.menu, w));
            const body = el('div', { class: 'window-body' });
            node.append(body);
            if (opts.status) {
                w.statusEl = el('div', {}, opts.status);
                node.append(el('div', { class: 'status-bar' }, w.statusEl));
            }
            if (!opts.fixedSize) node.append(el('div', { class: 'resize-handle' }));

            w.el = node;
            w.body = body;
            w.setTitle = t => { titleText.textContent = t; w.title = t; node.setAttribute('aria-label', t); renderTasks(); };
            w.setStatus = t => { if (w.statusEl) w.statusEl.textContent = t; };

            const width = Math.min(opts.width || 420, dw - 8);
            const height = Math.min(opts.height || 300, dh - 8);
            const n = windows.size % 6;

            Object.assign(node.style, { left: left + 'px', top: top + 'px', width: width + 'px', height: opts.autoHeight ? 'auto' : height + 'px' });
            if (isSmall() && !opts.fixedSize) node.classList.add('maximized');

            desktop.append(node);
            windows.add(w);
            opts.body?.(body, w);
            setTimeout(() => node.classList.remove('opening'), 200);

            node.addEventListener('pointerdown', () => focusWin(w), true);
            titleBar.addEventListener('dblclick', () => toggleMax(w));
            enableDrag(w, titleBar);
            enableResize(w);
            focusWin(w);
            return w;

        function enableDrag(w, handle) {
            handle.addEventListener('pointerdown', e => {
                if (e.target.closest('button') || w.el.classList.contains('maximized') || isSmall()) return;
                e.preventDefault();
                const startX = e.clientX, startY = e.clientY;
                const ox = w.el.offsetLeft, oy = w.el.offsetTop;
                handle.setPointerCapture(e.pointerId);
                const move = ev => {
                    const dw = desktop.clientWidth, dh = desktop.clientHeight;
                    const x = Math.max(60 - w.el.offsetWidth, Math.min(dw - 60, ox + ev.clientX - startX));
                    const y = Math.max(0, Math.min(dh - 24, oy + ev.clientY - startY));
                    w.el.style.left = x + 'px';
                    w.el.style.top = y + 'px';
                };
                const up = () => {
                    handle.removeEventListener('pointermove', move);
                    handle.removeEventListener('pointerup', up);
                    handle.removeEventListener('pointercancel', up);
                };
                handle.addEventListener('pointermove', move);
                handle.addEventListener('pointerup', up);
                handle.addEventListener('pointercancel', up);
            });
        }

        function enableResize(w) {
            const grip = w.el.querySelector('.resize-handle');
            if (!grip) return;
            grip.addEventListener('pointerdown', e => {
                e.preventDefault();
                e.stopPropagation();
                const sx = e.clientX, sy = e.clientY, sw = w.el.offsetWidth, sh = w.el.offsetHeight;
                grip.setPointerCapture(e.pointerId);
                const move = ev => {
                    w.el.style.width = Math.max(200, sw + ev.clientX - sx) + 'px';
                    w.el.style.height = Math.max(120, sh + ev.clientY - sy) + 'px';
                    w.onResize?.();
                };
                const up = () => {
                    grip.removeEventListener('pointermove', move);
                    grip.removeEventListener('pointerup', up);
                };
                grip.addEventListener('pointermove', move);
                grip.addEventListener('pointerup', up);
            });
        }

        // Clicking inside an iframe never reaches our pointerdown handler, but it

        window.addEventListener('blur', () => setTimeout(() => {
            const f = document.activeElement;

        function buildMenuBar(menu, w) {
            const bar = el('div', { class: 'menu-bar' });
            menu.forEach(m => {
                const wrap = el('div', { class: 'menu' });
                const drop = el('div', { class: 'dropdown' });
                const render = () => {
                    drop.innerHTML = '';
                    m.items.forEach(it => {
                        if (it === '-') return drop.append(el('hr'));
                        const b = el('button', { class: it.checked?.() ? 'checked' : '' }, el('span', {}, it.label), el('span', {}, it.key || ''));
                        b.addEventListener('click', () => { closeMenus(); it.action(w); });
                        drop.append(b);
                    });
                };
                const btn = el('button', { html: m.label.replace(/^(.)/, '<u>$1</u>') });
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    const wasOpen = wrap.classList.contains('open');
                    closeMenus();
                    if (!wasOpen) { render(); wrap.classList.add('open'); }
                });
                btn.addEventListener('pointerenter', () => {
                    if (bar.querySelector('.menu.open') && !wrap.classList.contains('open')) { closeMenus(); render(); wrap.classList.add('open'); }
                });
                wrap.append(btn, drop);
                bar.append(wrap);
            });
            return bar;

                function pad(n) { return String(Math.max(-99, Math.min(999, n))).padStart(3, '0'); }

                function reset() {
                    [cols, rows, count] = MINE_LEVELS[level];
                    clearInterval(timer);
                    started = over = false;
                    opened = flags = seconds = 0;
                    faceEl.textContent = '\u{1F642}';
                    mineLcd.textContent = pad(count);
                    timeLcd.textContent = pad(0);
                    const avail = Math.min(desktop.clientWidth - 30, 520);
                    const cs = Math.max(18, Math.min(26, Math.floor(avail / cols)));
                    gridEl.style.setProperty('--cs', cs + 'px');
                    gridEl.style.gridTemplateColumns = `repeat(${cols}, ${cs}px)`;
                    gridEl.innerHTML = '';
                    cells = [];
                    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
                        const b = el('button', { class: 'cell', 'aria-label': `Row ${r + 1} column ${c + 1}` });
                        const cell = { r, c, mine: false, n: 0, open: false, flag: false, el: b };
                        attachCell(cell);
                        cells.push(cell);
                        gridEl.append(b);
                    }
                    grid = (r, c) => (r >= 0 && r < rows && c >= 0 && c < cols) ? cells[r * cols + c] : null;
                    w.el.style.width = 'auto';
                    // keep the window on screen when the grid size changes
                    const maxLeft = Math.max(0, desktop.clientWidth - w.el.offsetWidth);

                }

                const around = cell => {
                    const out = [];
                    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++)
                        if (dr || dc) { const n = grid(cell.r + dr, cell.c + dc); if (n) out.push(n); }
                    return out;
                };

                function placeMines(safe) {
                    const banned = new Set([safe, ...around(safe)]);
                    const pool = cells.filter(c => !banned.has(c));
                    for (let i = 0; i < count; i++) {
                        const j = i + Math.floor(Math.random() * (pool.length - i));
                        [pool[i], pool[j]] = [pool[j], pool[i]];
                        pool[i].mine = true;
                    }
                    cells.forEach(c => { c.n = around(c).filter(x => x.mine).length; });
                }

                function attachCell(cell) {
                    let pressTimer = 0, longPressed = false;
                    cell.el.addEventListener('pointerdown', e => {
                        if (over) return;
                        if (e.button === 0) faceEl.textContent = '\u{1F62E}';
                        longPressed = false;
                        if (isTouchEvent(e)) pressTimer = setTimeout(() => { longPressed = true; toggleFlag(cell); navigator.vibrate?.(20); }, 420);
                    });
                    const cancel = () => { clearTimeout(pressTimer); if (!over) faceEl.textContent = '\u{1F642}'; };
                    cell.el.addEventListener('pointerleave', cancel);
                    cell.el.addEventListener('pointercancel', cancel);
                    cell.el.addEventListener('pointerup', e => {
                        clearTimeout(pressTimer);
                        if (!over) faceEl.textContent = '\u{1F642}';
                        if (longPressed || over || e.button !== 0) return;

                function reveal(cell) {
                    if (cell.open || cell.flag) return;
                    if (!started) {
                        started = true;
                        placeMines(cell);
                        timer = setInterval(() => { seconds++; timeLcd.textContent = pad(seconds); }, 1000);
                    }
                    if (cell.mine) return lose(cell);
                    const stack = [cell];
                    while (stack.length) {
                        const c = stack.pop();
                        if (c.open || c.flag) continue;
                        c.open = true;
                        opened++;
                        c.el.classList.add('open');
                        c.el.disabled = false;
                        if (c.n) { c.el.textContent = c.n; c.el.classList.add('n' + c.n); }

                    if (opened === cols * rows - count) win();

                    over = true;
                    clearInterval(timer);
                    faceEl.textContent = '\u{1F635}';
                    cells.forEach(c => {

                    });
                    cell.el.classList.add('boom');

                    over = true;

            },
        };

        APPS.about = {
            title: 'About', icon: 'windows', open() {
                msgBox('About Windows 98', 'Microsoft Windows 98\nVolkan Edition\n\nThis computer is running on HTML, CSS\nand a questionable amount of JavaScript.', { icon: 'windows' });
            },
        };

        APPS.help = {
            title: 'Help', icon: 'help', open() {
                msgBox('Windows Help', 'Double-click an icon to open it\n(on a phone, just tap).\n\nRight-click or long-press the desktop\nfor more options.\n\nStart > Shut Down takes you back\nto the portfolio.', { icon: 'help' });
            },
        };

        const SINGLE = new Map();
        function openApp(id, args) {
            closeStart();
            const app = APPS[id];
            if (!app) return;
            if (app.single) {
                const existing = SINGLE.get(id);
                if (existing && windows.has(existing)) return focusWin(existing);
            }
            const before = new Set(windows);
            app.open(args || {});
            const created = [...windows].find(w => !before.has(w));
            if (created) { created.appId = created.appId || id; if (app.single) SINGLE.set(id, created); }
        }

        function programList() {
            return [
                { name: 'Notepad', icon: 'notepad', action: () => openApp('notepad') },
                { name: 'Paint', icon: 'paint', action: () => openApp('paint') },
                { name: 'Minesweeper', icon: 'mine', action: () => openApp('minesweeper') },
                { name: 'Media Player', icon: 'cd', action: () => openApp('mplayer') },
                { name: 'Internet Explorer', icon: 'ie', action: () => openApp('ie') },
                { name: 'MS-DOS Prompt', icon: 'dos', action: () => openApp('dos') },
            ];
        }

        // ======================================================================
        // Desktop icons
        // ======================================================================
        const DESKTOP_ITEMS = [
            { name: 'My Computer', icon: 'computer', app: 'computer' },
            { name: 'My Projects', icon: 'folder', app: 'projects' },
            { name: 'Internet Explorer', icon: 'ie', app: 'ie' },
            { name: 'Media Player', icon: 'cd', app: 'mplayer' },
            { name: 'Paint', icon: 'paint', app: 'paint' },
            { name: 'Minesweeper', icon: 'mine', app: 'minesweeper' },
            { name: 'README.txt', icon: 'txt', app: 'notepad' },
            { name: 'MS-DOS Prompt', icon: 'dos', app: 'dos' },
            { name: 'Parking Puzzle', icon: 'car', top: '../../page2.html' },
            { name: 'Back to Portfolio', icon: 'home', top: '../../index.html' },
            { name: 'Recycle Bin', icon: 'recycle', app: 'recycle' },
        ];

        function renderIcons() {
            const wrap = $('icons');
            wrap.innerHTML = '';
            DESKTOP_ITEMS.forEach(it => {
                const b = el('button', { class: 'desktop-icon', role: 'option', 'aria-label': it.name },
                    el('img', { class: 'px', src: iconUrl(it.icon), alt: '' }), el('span', {}, it.name));
                b.addEventListener('pointerdown', () => {
                    wrap.querySelectorAll('.selected').forEach(s => s.classList.remove('selected'));
                    b.classList.add('selected');
                });
                bindOpen(b, () => it.top ? goTop(it.top) : openApp(it.app));
                wrap.append(b);
            });
        }

        $('icons').addEventListener('pointerdown', e => {
            if (e.target.id === 'icons') {
                $('icons').querySelectorAll('.selected').forEach(s => s.classList.remove('selected'));
                blurAll();
            }
        });

        // quick launch
        [['ie', 'Internet Explorer'], ['cd', 'Media Player', 'mplayer'], ['dos', 'MS-DOS Prompt']].forEach(([icon, title, app = icon]) => {
            $('quickLaunch').append(el('button', { title, 'aria-label': title, onclick: () => openApp(app) }, el('img', { class: 'px', src: iconUrl(icon), alt: '' })));
        });

        // ======================================================================
        // Start menu
        // ======================================================================
        const START_ITEMS = [
            {
                label: 'Programs', icon: 'folder', sub: [
                    { label: 'Accessories', icon: 'folder', sub: [
                        { label: 'Notepad', icon: 'notepad', app: 'notepad' },
                        { label: 'Paint', icon: 'paint', app: 'paint' },
                        { label: 'Media Player', icon: 'cd', app: 'mplayer' },
                        { label: 'Games', icon: 'folder', sub: [
                            { label: 'Minesweeper', icon: 'mine', app: 'minesweeper' },
                            { label: 'Parking Puzzle', icon: 'car', top: '../../page2.html' },
                        ] },
                    ] },
                    { label: 'Internet Explorer', icon: 'ie', app: 'ie' },
                    { label: 'MS-DOS Prompt', icon: 'dos', app: 'dos' },
                    { label: 'Windows Explorer', icon: 'computer', app: 'computer' },
                ]
            },
            { label: 'Documents', icon: 'folder', sub: [
                { label: 'README.txt', icon: 'txt', app: 'notepad' },
                { label: 'My Projects', icon: 'folder', app: 'projects' },
            ] },
            { label: 'Settings', icon: 'display', sub: [
                { label: 'Display', icon: 'display', app: 'display' },
                { label: 'Control Panel', icon: 'computer', app: 'computer' },
            ] },
            { label: 'Help', icon: 'help', app: 'help' },
            { label: 'Run...', icon: 'run', app: 'run' },
            '-',
            { label: 'Back to Portfolio', icon: 'home', top: '../../index.html' },
            { label: 'Shut Down...', icon: 'shutdown', action: () => shutDownDialog() },
        ];

        function buildStart(items, container) {
            items.forEach(it => {
                if (it === '-') return container.append(el('hr'));
                const btn = el('button', { role: 'menuitem' }, el('img', { class: 'px', src: iconUrl(it.icon), alt: '' }), el('span', {}, it.label));
                if (it.sub) {
                    const wrap = el('div', { class: 'has-sub' });
                    const sub = el('div', { class: 'submenu', role: 'menu' });
                    buildStart(it.sub, sub);
                    btn.setAttribute('aria-haspopup', 'menu');
                    const openSub = () => {
                        [...wrap.parentElement.children].forEach(s => s !== wrap && s.classList?.remove('open'));
                        wrap.classList.add('open');
                    };
                    btn.addEventListener('click', e => { e.stopPropagation(); wrap.classList.contains('open') && isSmall() ? wrap.classList.remove('open') : openSub(); });
                    btn.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') openSub(); });
                    wrap.append(btn, sub);
                    container.append(wrap);
                } else {
                    btn.addEventListener('pointerenter', e => {
                        if (e.pointerType === 'mouse') [...container.children].forEach(s => s.classList?.remove('open'));
                    });
                    btn.addEventListener('click', () => {
                        closeStart();
                        if (it.top) goTop(it.top);
                        else if (it.app) openApp(it.app);
                        else it.action?.();
                    });
                    container.append(btn);
                }
            });
        }
        buildStart(START_ITEMS, $('startItems'));

        function closeStart() {
            $('startMenu').classList.remove('open');
            $('startBtn').classList.remove('open');
            $('startBtn').setAttribute('aria-expanded', 'false');
            document.querySelectorAll('.has-sub.open').forEach(s => s.classList.remove('open'));
        }
        $('startBtn').addEventListener('click', e => {
            e.stopPropagation();
            const open = !$('startMenu').classList.contains('open');
            closeStart();
            if (open) {
                $('startMenu').classList.add('open');
                $('startBtn').classList.add('open');
                $('startBtn').setAttribute('aria-expanded', 'true');
            }
        });
        document.addEventListener('pointerdown', e => {
            if (!e.target.closest('#startMenu, #startBtn')) closeStart();
            if (!e.target.closest('.menu')) closeMenus();
            if (!e.target.closest('#ctxMenu')) $('ctxMenu').classList.remove('open');
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closeStart(); closeMenus(); $('ctxMenu').classList.remove('open'); }
        });

        // ======================================================================
        // Desktop context menu (right-click / long-press)
        // ======================================================================
        function showCtx(x, y) {
            const m = $('ctxMenu');
            m.innerHTML = '';
            const add = (label, fn) => m.append(el('button', { onclick: () => { m.classList.remove('open'); fn(); } }, label));
            add('Arrange Icons', () => renderIcons());
            add('Refresh', () => { renderIcons(); applyWallpaper(store.get('wallpaper')); });
            m.append(el('hr'));
            add('New Text Document', () => openApp('notepad', { name: 'New Text Document.txt', text: '' }));
            m.append(el('hr'));
            add('Properties', () => openApp('display'));
            m.classList.add('open');
            const r = desktop.getBoundingClientRect();
            m.style.left = Math.min(x, r.width - m.offsetWidth - 2) + 'px';
            m.style.top = Math.min(y, r.height - m.offsetHeight - 2) + 'px';
        }
        desktop.addEventListener('contextmenu', e => {
            if (e.target.closest('.window')) return;
            e.preventDefault();
            showCtx(e.clientX, e.clientY);
        });
        (() => {
            let t = 0, sx = 0, sy = 0;
            desktop.addEventListener('pointerdown', e => {
                if (!isTouchEvent(e) || e.target.closest('.window, .desktop-icon')) return;
                sx = e.clientX; sy = e.clientY;
                t = setTimeout(() => showCtx(sx, sy), 550);
            });
            const cancel = e => { if (!e || Math.hypot(e.clientX - sx, e.clientY - sy) > 10 || e.type !== 'pointermove') clearTimeout(t); };
            desktop.addEventListener('pointermove', cancel);
            desktop.addEventListener('pointerup', () => clearTimeout(t));
            desktop.addEventListener('pointercancel', () => clearTimeout(t));
        })();

        // ======================================================================
        // Clock
        // ======================================================================
        function tickClock() {
            $('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }
        tickClock();
        setInterval(tickClock, 15000);
        $('clock').title = new Date().toDateString();

        // ======================================================================
        // Screen saver (starfield) after 2 minutes idle
        // ======================================================================
        const saverCanvas = $('screensaver');
        let saverRaf = 0, idleTimer = 0, saverStarted = 0;
        function startSaver() {
            if (saverRaf) return;
            saverStarted = Date.now();
            saverCanvas.style.display = 'block';
            const g = saverCanvas.getContext('2d');
            const stars = Array.from({ length: 220 }, () => ({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() }));
            const loop = () => {
                const W = saverCanvas.width = saverCanvas.clientWidth;
                const H = saverCanvas.height = saverCanvas.clientHeight;
                g.fillStyle = '#000';
                g.fillRect(0, 0, W, H);
                g.fillStyle = '#fff';
                stars.forEach(s => {
                    s.z -= 0.008;
                    if (s.z <= 0.01) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = 1; }
                    const px = W / 2 + s.x / s.z * W / 2, py = H / 2 + s.y / s.z * H / 2;
                    const size = Math.max(1, (1 - s.z) * 3);
                    g.fillRect(px | 0, py | 0, size, size);
                });
                saverRaf = requestAnimationFrame(loop);
            };
            saverRaf = requestAnimationFrame(loop);
        }
        function stopSaver() {
            if (!saverRaf) return;
            cancelAnimationFrame(saverRaf);
            saverRaf = 0;
            saverCanvas.style.display = 'none';
        }
        function resetIdle() {
            stopSaver();
            clearTimeout(idleTimer);
            if (store.get('saver', 'Starfield') !== '(None)') idleTimer = setTimeout(startSaver, 120000);
        }
        // ignore input for a moment after the saver starts (the click that
        // started a preview, a mouse that is still settling)
        ['pointerdown', 'pointermove', 'keydown', 'wheel'].forEach(t => window.addEventListener(t, () => {
            if (saverRaf && Date.now() - saverStarted < 800) return;
            resetIdle();
        }, { passive: true }));

        // ======================================================================
        // Boot + shut down
        // ======================================================================
        const boot = $('boot');
        function runBoot(fast) {
            boot.classList.remove('hidden', 'logo');
            const lines = ['Award Modular BIOS v4.51PG', 'Memory Test : 65536K OK', '', 'Detecting IDE drives ... PORTFOLIO (D:)', '', 'Starting Windows 98...'];
            const textEl = $('bootText');
            textEl.textContent = '';
            let i = 0, done = false;
            const finish = () => {
                if (done) return;
                done = true;
                boot.classList.add('hidden');
                resetIdle();
            };
            const step = () => {
                if (done) return;
                if (i < lines.length) { textEl.textContent += lines[i++] + '\n'; setTimeout(step, fast ? 40 : 120); }
                else { boot.classList.add('logo'); setTimeout(finish, fast ? 500 : 1300); }
            };
            step();
            boot.onclick = finish;
        }

        async function shutDownDialog() {
            const r = await msgBox('Shut Down Windows', 'What do you want the computer to do?', { icon: 'shutdown', buttons: ['Shut down', 'Restart', 'Cancel'] });
            if (r === 'Shut down') shutDown();
            else if (r === 'Restart') restart();
        }
        function shutDown() {
            [...windows].forEach(closeWin);
            setTimeout(() => $('shutdownScreen').classList.remove('hidden'), 300);
        }
        function restart() {
            [...windows].forEach(closeWin);
            $('shutdownScreen').classList.add('hidden');
            runBoot(true);
        }
        $('restartBtn').addEventListener('click', restart);
        $('leaveBtn').addEventListener('click', () => goTop('../../index.html'));

        // ======================================================================
        // Go
        // ======================================================================
        updateSmall();
        renderIcons();
        runBoot(sessionStorage.getItem('w98.booted') === '1');
        try { sessionStorage.setItem('w98.booted', '1'); } catch { }
        // first visit: open the README so people know what they can do
        if (!store.get('seenReadme', false)) {
            store.set('seenReadme', true);
            setTimeout(() => openApp('notepad'), 2600);
        }
    </script>
</body>
