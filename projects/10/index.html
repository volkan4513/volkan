<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#20232e">
    <title>Fuji Poster</title>
    <style>
        :root {
            --bg: #1b1d26;
            --cream: #f1e8d6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--cream);
            font-family: system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        /* blurred sky behind the poster fills the letterbox */
        #backdrop {
            position: fixed;
            inset: -40px;
            background: center / cover no-repeat;
            filter: blur(40px) brightness(.38) saturate(.7);
            transform: scale(1.1);
        }

        /* the poster: 1684 x 2528 poster units, scaled to fit the screen (see fit()) */
        #stage {
            position: absolute;
            left: 50%;
            top: 50%;
            overflow: hidden;
            transform-origin: 0 0;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
            touch-action: none;
            opacity: 0;
            transition: opacity .8s ease;
        }

        #stage.ready { opacity: 1; }
        #stage.oncar { cursor: grab; }
        /* embedded in the main page: let vertical swipes scroll the page */
        .embed #stage { touch-action: pan-y; }
        html.embed, html.embed body { overscroll-behavior: auto; }
        html.shot #hint { display: none; }   /* ?shot=1: clean poster for the main-page thumbnail */
        /* embedded: the hint sits in the empty sky, top right, and pulses until the panel is touched */
        .embed #hint {
            top: 13.5%; left: 56%; bottom: auto; width: 31%; transform: none;
            font-size: 9px; line-height: 1.3; padding: 5px 7px; text-align: center; border-radius: 0;
            color: #ffdf00; animation: hintPulse 1.4s ease-in-out infinite;
        }
        @keyframes hintPulse {
            50% { box-shadow: 0 0 0 3px rgba(255, 223, 0, .55), 0 0 14px rgba(255, 223, 0, .8); background: rgba(40, 34, 10, .85); }
        }
        #stage.dragging { cursor: grabbing; }

        /* scene and car are drawn a little larger than the poster so parallax never shows an edge */
        .depth {
            position: absolute;
            inset: 0;
            transform-origin: 50% 50%;
        }

        .layer, .car, .shadow, .text {
            position: absolute;
            display: block;
            pointer-events: none;
            will-change: transform;
        }

        .shadow {
            border-radius: 50%;
            background: radial-gradient(closest-side, rgba(8, 9, 16, .45), rgba(8, 9, 16, .2) 60%, transparent);
        }

        /* film grain over the whole poster, car and text included. It sits outside
           the scaled stage so its dots stay screen-sized instead of shrinking away. */
        #grain {
            position: fixed;
            pointer-events: none;
            opacity: .32;
            mix-blend-mode: overlay;
            background-size: 256px 256px;
        }

        #vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(10, 10, 20, .45) 100%);
        }

        #hint {
            position: fixed;
            left: 50%;
            bottom: max(14px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(20, 22, 30, .6);
            backdrop-filter: blur(6px);
            font-size: 13px;
            letter-spacing: .04em;
            color: var(--cream);
            pointer-events: none;
            transition: opacity .6s ease;
        }

        #hint.gone { opacity: 0; }


        #loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 13px;
            letter-spacing: .2em;
            color: rgba(241, 232, 214, .6);
            pointer-events: none;
            transition: opacity .5s ease;
        }

        #loading.gone { opacity: 0; }
    </style>
</head>

<body>
    <script src="../../pixel-transition.js"></script>
    <script src="../../offline.js"></script>
    <script>PixelTransition.reveal(); if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');
    if (/[?&]shot=1/.test(location.search)) document.documentElement.classList.add('shot');</script>
    <script src="../../site-nav.js" data-home="../../index.html"></script>

    <div id="backdrop"></div>
    <div id="loading">LOADING</div>

    <div id="stage" aria-label="Mt. Fuji poster. Drag the car to turn it.">
        <div class="depth" id="scene"></div>
        <div id="vignette"></div>
        <img class="text" id="text" alt="">
        <div class="depth" id="carDepth">
            <div class="shadow" id="shadow"></div>
            <canvas class="car" id="car"></canvas>
        </div>
    </div>

    <div id="grain"></div>
    <div id="hint">drag the car to turn it</div>

    <script type="module">
    import * as THREE from './lib/three.module.min.js';
    import { GLTFLoader } from './lib/GLTFLoader.js';

    (() => {
        const OVERSCAN = 1.05;          // scene drawn this much bigger than the poster
        const LEAN_X = 18, LEAN_Y = 10; // how far a hovered layer can move, in poster units
        const FOLLOW = 0.22;            // share of the pointer's motion a hovered layer follows
        const HIT_SCALE = 0.25;         // hover hit maps are kept at this fraction of poster size
        const DEG_PER_PX = 0.45;        // drag speed of the car
        const RETURN_AFTER = 6000;      // ms idle before the car swings back to the poster view
        const CAR_URL = 'models/car.glb';
        const CAR_W = 1900, CAR_H = 680;  // the car's canvas, in poster units (bottom-centred on scene.car)
        const CAR_LEN = 1650;           // length of the model on the poster, in poster units
        const CAR_YAW = 0;              // degrees: hero angle (the car's turn at rest)
        // confirmed hero view: fov = camera lens in degrees, yaw = the car's turn at rest, elev = camera height angle
        const TUNE = { fov: 8, yaw: 126, elev: 4.5 };
        const STEP = 15;                // degrees per arrow-key press

        const stage = document.getElementById('stage');
        const sceneEl = document.getElementById('scene');
        const carDepth = document.getElementById('carDepth');
        const carImg = document.getElementById('car');
        const shadow = document.getElementById('shadow');
        const textImg = document.getElementById('text');
        const hint = document.getElementById('hint');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

        let W = 1684, H = 2528, scene, layers = [];

        // ---------------------------------------------------------------- layout
        function place(el, x, y, w, h) {
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.width = w + 'px';
            el.style.height = h + 'px';
        }

        function fit() {
            const vw = innerWidth, vh = innerHeight;
            const s = Math.min(vw / W, vh / H);
            stage.style.width = W + 'px';
            stage.style.height = H + 'px';
            stage.style.transform = `translate(${-W * s / 2}px, ${-H * s / 2}px) scale(${s})`;
            const g = document.getElementById('grain').style;
            g.left = (vw - W * s) / 2 + 'px';
            g.top = (vh - H * s) / 2 + 'px';
            g.width = W * s + 'px';
            g.height = H * s + 'px';
            resizeCar(s);
        }

        // ---------------------------------------------------------------- grain
        // one tile of noise, jumped to a new random offset ~12 times a second
        function makeGrain() {
            const N = 256, c = document.createElement('canvas');
            c.width = c.height = N;
            const g = c.getContext('2d');
            const img = g.createImageData(N, N);
            for (let i = 0; i < img.data.length; i += 4) {
                const v = 128 + ((Math.random() + Math.random() + Math.random()) / 3 - .5) * 255;
                img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
                img.data[i + 3] = 255;
            }
            g.putImageData(img, 0, 0);
            const el = document.getElementById('grain');
            el.style.backgroundImage = `url(${c.toDataURL()})`;
            if (reduceMotion) return;
            setInterval(() => {
                el.style.backgroundPosition = `${Math.random() * N | 0}px ${Math.random() * N | 0}px`;
            }, 80);
        }

        // ---------------------------------------------------------------- hover
        // Only the layer under the pointer moves: it is nudged along with the
        // pointer's motion (a little, up to LEAN_X/Y) and settles back once the
        // pointer leaves it.
        let hovered = null, lastP = null;

        function toScene(e) {
            const r = stage.getBoundingClientRect();
            const px = (e.clientX - r.left) / r.width * W, py = (e.clientY - r.top) / r.height * H;
            return { x: (px - W / 2) / OVERSCAN + W / 2, y: (py - H / 2) / OVERSCAN + H / 2 };
        }

        function hitMap(l, img) {
            l.hw = Math.max(1, Math.ceil(l.w * HIT_SCALE));
            l.hh = Math.max(1, Math.ceil(l.h * HIT_SCALE));
            try {
                const c = document.createElement('canvas');
                c.width = l.hw;
                c.height = l.hh;
                const g = c.getContext('2d', { willReadFrequently: true });
                g.drawImage(img, 0, 0, l.hw, l.hh);
                l.hit = g.getImageData(0, 0, l.hw, l.hh).data;
            } catch (err) {
                l.hit = null;  // e.g. opened from file:// - fall back to the layer's box
            }
        }

        function covers(l, p) {
            const u = Math.floor((p.x - l.x) * HIT_SCALE), v = Math.floor((p.y - l.y) * HIT_SCALE);
            if (u < 0 || v < 0 || u >= l.hw || v >= l.hh) return false;
            return !l.hit || l.hit[(v * l.hw + u) * 4 + 3] > 90;
        }

        function onCar(p) {
            if (!carReady) return false;
            const c = scene.car;
            return Math.abs(p.x - c.cx) < CAR_W * 0.46 && p.y > c.bottom - CAR_H * 0.92 && p.y < c.bottom;
        }

        const clamp = (v, m) => Math.max(-m, Math.min(m, v));

        function hoverAt(e) {
            const p = toScene(e);
            const dx = lastP ? p.x - lastP.x : 0, dy = lastP ? p.y - lastP.y : 0;
            lastP = p;
            const car = onCar(p);
            stage.classList.toggle('oncar', car);
            const l = car ? null : layers.findLast(l => covers(l, p)) || null;
            if (l && l !== hovered) {  // pick up from wherever it is now
                l.tx = l.cx;
                l.ty = l.cy;
            }
            hovered = l;
            if (!l) return;
            l.tx = clamp(l.tx + dx * FOLLOW, LEAN_X);
            l.ty = clamp(l.ty + dy * FOLLOW, LEAN_Y);
        }

        function unhover() {
            hovered = null;
            lastP = null;
        }

        stage.addEventListener('pointerleave', () => {
            if (!dragging) unhover();
        });

        // ---------------------------------------------------------------- car
        let carFit = null, carBaseYaw = 0, angle = 0, vel = 0, dragging = false, touching = false, dragX = 0, lastInput = 0, carReady = false, drawn = null;

        // orthographic camera: 1 world unit = 1 poster unit, ground plane at the wheels (y = 0)
        const GROUND_Y = () => scene.car.ground - (scene.car.bottom - CAR_H);  // wheels, in canvas units
        const renderer = new THREE.WebGLRenderer({ canvas: carImg, alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0);
        const three = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(TUNE.fov, CAR_W / CAR_H, 10, 8000);
        const pivot = new THREE.Group();
        three.add(pivot);
        // dusk lighting to match the poster: cool violet sky, warm brown road bounce,
        // a low orange sun from the left (behind the mountain) and a faint blue rim from the right
        three.add(new THREE.HemisphereLight(0x8f95bd, 0x6a5444, 1.15));
        const sun = new THREE.DirectionalLight(0xff9a58, 3.3);
        sun.position.set(-900, 380, 450);
        three.add(sun);
        const fill = new THREE.DirectionalLight(0xffb98a, 0.5);
        fill.position.set(300, 250, 800);
        three.add(fill);
        const rim = new THREE.DirectionalLight(0x7f95e0, 0.9);
        rim.position.set(800, 350, -500);
        three.add(rim);

        function resizeCar(s) {
            const px = Math.min(devicePixelRatio || 1, 2) * s;
            renderer.setPixelRatio(1);
            renderer.setSize(Math.round(CAR_W * px), Math.round(CAR_H * px), false);
            carImg.style.width = CAR_W + 'px';
            carImg.style.height = CAR_H + 'px';
            drawn = null;  // force a redraw
        }

        // perspective camera at the hero elevation. The distance is chosen so that 1 unit at the wheels
        // is still 1 poster unit whatever the FOV, and the view is shifted so the wheels stay on the ground line.
        function applyCamera() {
            if (!scene) return;
            const fov = TUNE.fov * Math.PI / 180, e = TUNE.elev * Math.PI / 180;
            const d = CAR_H / (2 * Math.tan(fov / 2));
            camera.fov = TUNE.fov;
            camera.position.set(0, Math.sin(e) * d, Math.cos(e) * d);
            camera.lookAt(0, 0, 0);
            camera.clearViewOffset();
            camera.setViewOffset(CAR_W, CAR_H, 0, CAR_H / 2 - GROUND_Y(), CAR_W, CAR_H);
            camera.updateProjectionMatrix();
            if (carFit) carFit.rotation.y = carBaseYaw + TUNE.yaw * Math.PI / 180;
            drawn = null;
        }

        function placeCar() {
            const c = scene.car;
            place(carImg, c.cx - CAR_W / 2, c.bottom - CAR_H, CAR_W, CAR_H);
            applyCamera();
            // soft ambient shade on the road
            const sw = CAR_LEN * 0.95, sh = Math.max(60, CAR_H * 0.16);
            place(shadow, c.cx - sw / 2, c.ground - sh * 0.55, sw, sh);
        }

        function loadCar() {
            return new GLTFLoader().loadAsync(CAR_URL).then(gltf => {
                const m = gltf.scene;
                m.traverse(o => { if (o.isCamera || o.isLight) o.visible = false; });
                // the Silvia file ships with a big road plane under the car: drop it so it neither draws nor skews the fit
                // the body is marked metallic but the scene has no environment map to reflect, which renders it dark grey: keep the paint colour
                m.traverse(o => {
                    if (!o.isMesh || !o.material) return;
                    for (const mat of [].concat(o.material)) {
                        if (mat.metalness > 0.2) mat.metalness = 0.12;
                        if (mat.roughness > 0.6) mat.roughness = 0.55;
                    }
                });
                const junk = [];
                m.traverse(o => { if (/road/i.test(o.name)) junk.push(o); });
                junk.forEach(o => o.removeFromParent());   // removed, not hidden: the fit box counts hidden meshes too
                // centre it, sit the wheels on y = 0, and scale the long axis to CAR_LEN
                const box = new THREE.Box3().setFromObject(m);
                const size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
                const long = Math.max(size.x, size.z), k = CAR_LEN / long;
                m.position.set(-mid.x, -box.min.y, -mid.z);
                const fit = new THREE.Group();
                fit.add(m);
                fit.scale.setScalar(k);
                // side on to the camera (+z): a model that is longer in z is turned a quarter
                carBaseYaw = size.z > size.x ? Math.PI / 2 : 0;
                carFit = fit;
                fit.rotation.y = carBaseYaw + TUNE.yaw * Math.PI / 180;
                pivot.add(fit);
                carReady = true;
            });
        }

        function drawCar() {
            if (!carReady || angle === drawn) return;
            drawn = angle;
            pivot.rotation.y = -angle * Math.PI / 180;  // the near side of the car follows the pointer
            renderer.render(three, camera);
        }

        // press on the car to turn it; a finger anywhere else acts like hovering
        stage.addEventListener('pointerdown', e => {
            stage.setPointerCapture(e.pointerId);
            if (!onCar(toScene(e))) {
                if (e.pointerType !== 'mouse') {
                    touching = true;
                    lastP = null;
                    hoverAt(e);
                }
                return;
            }
            dragging = true;
            unhover();
            dragX = e.clientX;
            vel = 0;
            lastInput = performance.now();
            stage.classList.add('dragging');
            hint.classList.add('gone');
        });

        stage.addEventListener('pointermove', e => {
            if (!dragging) {
                if (e.pointerType === 'mouse' || touching) hoverAt(e);
                return;
            }
            const dx = e.clientX - dragX;
            dragX = e.clientX;
            const d = -dx * DEG_PER_PX;  // the near side of the car follows the pointer
            angle += d;
            vel = vel * 0.5 + d * 0.5;
            lastInput = performance.now();
        });

        function endDrag(e) {
            if (touching) unhover();
            touching = false;
            if (!dragging) return;
            dragging = false;
            stage.classList.remove('dragging');
            lastInput = performance.now();
            if (e.pointerType === 'mouse') hoverAt(e);
        }
        stage.addEventListener('pointerup', endDrag);
        stage.addEventListener('pointercancel', endDrag);

        addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                angle += (e.key === 'ArrowLeft' ? 1 : -1) * STEP;
                vel = 0;
                lastInput = performance.now();
                hint.classList.add('gone');
            }
        });

        // coming back to the tab: if the car was idle long enough to be heading home, put it there at once
        // instead of letting it visibly swing round
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) return;
            const now = performance.now();
            if (!dragging && now - lastInput > RETURN_AFTER) {
                angle = Math.round(angle / 360) * 360;
                drawn = null;
            }
            prev = now;
        });

        // ---------------------------------------------------------------- loop
        let prev = performance.now();
        // pause: no frames while the tab is hidden or the panel is off screen; wake() restarts the loop
        let looping = true, inView = true;
        const shouldRun = () => !document.hidden && inView;
        function wake() {
            if (!looping && shouldRun()) { looping = true; prev = performance.now(); requestAnimationFrame(tick); }
        }
        document.addEventListener('visibilitychange', wake);
        if ('IntersectionObserver' in window) new IntersectionObserver(es => { inView = es[es.length - 1].isIntersecting; wake(); }).observe(stage);

        function tick(now) {
            if (!shouldRun()) { looping = false; return; }
            const dt = Math.min(50, now - prev) / 1000;
            prev = now;

            // car: no coasting after release; after a pause it swings home to the hero view
            if (!dragging) {
                if (now - lastInput > RETURN_AFTER) {
                    const home = Math.round(angle / 360) * 360;
                    angle += (home - angle) * Math.min(1, dt * 2.2);
                    if (Math.abs(home - angle) < 0.5) angle = home;
                }
            }
            drawCar();

            // layers: the hovered one eases toward its lean, the rest ease home
            const k = 1 - Math.pow(0.01, dt);
            for (const l of layers) {
                const tx = l === hovered ? l.tx : 0, ty = l === hovered ? l.ty : 0;
                if (tx === l.cx && ty === l.cy) continue;
                l.cx += (tx - l.cx) * k;
                l.cy += (ty - l.cy) * k;
                if (Math.abs(tx - l.cx) < 0.05 && Math.abs(ty - l.cy) < 0.05) {
                    l.cx = tx;
                    l.cy = ty;
                }
                const t = `translate3d(${l.cx}px, ${l.cy}px, 0)`;
                for (const el of l.els) el.style.transform = t;
            }

            requestAnimationFrame(tick);
        }

        // power lines strung off the pole, as sagging curves in poster units
        function wires(list) {
            const NS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(NS, 'svg');
            svg.setAttribute('class', 'layer');
            svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
            place(svg, 0, 0, W, H);
            svg.style.overflow = 'visible';
            for (const [x1, y1, x2, y2, sag] of list) {
                const path = document.createElementNS(NS, 'path');
                path.setAttribute('d', `M${x1} ${y1} Q${(x1 + x2) / 2} ${(y1 + y2) / 2 + sag * 2} ${x2} ${y2}`);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', 'rgba(24, 20, 26, .85)');
                path.setAttribute('stroke-width', '3');
                svg.appendChild(path);
            }
            return svg;
        }

        // ---------------------------------------------------------------- load
        function loadImg(src) {
            return new Promise((res, rej) => {
                const im = new Image();
                im.decoding = 'async';
                im.onload = () => (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(() => res(im));
                im.onerror = rej;
                im.src = src;
            });
        }

        fetch('scene.json').then(r => r.json()).then(async data => {
            scene = data;
            [W, H] = data.size;
            fit();
            addEventListener('resize', fit);
            sceneEl.style.transform = carDepth.style.transform = `scale(${OVERSCAN})`;

            placeCar();
            resizeCar(Math.min(innerWidth / W, innerHeight / H));
            const [imgs] = await Promise.all([
                Promise.all(data.layers.map(l => loadImg(l.src))),
                loadCar(),
            ]);

            data.layers.forEach((l, i) => {
                if (l.fixed) {
                    textImg.src = imgs[i].src;
                    place(textImg, l.x, l.y, l.w, l.h);
                    return;
                }
                const el = imgs[i];
                el.className = 'layer';
                el.alt = '';
                place(el, l.x, l.y, l.w, l.h);
                sceneEl.appendChild(el);
                const layer = { ...l, els: [el], cx: 0, cy: 0, tx: 0, ty: 0 };
                hitMap(layer, el);
                layers.push(layer);
                if (l.wires) {  // the power lines move with their pole
                    const svg = wires(l.wires);
                    sceneEl.insertBefore(svg, el);
                    layer.els.push(svg);
                }
                if (l.id === 'sky') document.getElementById('backdrop').style.backgroundImage = `url(${l.src})`;
            });
            makeGrain();
            stage.classList.add('ready');
            document.getElementById('loading').classList.add('gone');
            if (document.documentElement.classList.contains('embed')) addEventListener('pointerdown', () => hint.classList.add('gone'), { once: true });
            else setTimeout(() => hint.classList.add('gone'), 7000);
            requestAnimationFrame(tick);
        }).catch(err => {
            document.getElementById('loading').textContent = 'COULD NOT LOAD THE SCENE';
            console.error(err);
        });
    })();
    </script>
</body>

</html>
