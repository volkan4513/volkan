<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PS Music Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0d0d0d;
            --panel: #1b1d22;
            --panel-hi: #2a2d35;
            --plate: #c9c9cf;
            --plate-dk: #8e8e96;
            --text: #f4f1e8;
            --muted: #8d93a0;
            --hi: #ffd23f;
            /* PlayStation face-button colours */
            --tri: #3ddc84;
            --cir: #ff4d6d;
            --crs: #5aa9ff;
            --sqr: #ff7ad9;
            --px: 3px;
            --bg: #1a2422;
            --font: 'Press Start 2P', ui-monospace, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font: 12px/1.6 var(--font);
            color: var(--text);
            background-color: var(--bg);
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, 0.025) 25%, transparent 25% 75%, rgba(255, 255, 255, 0.025) 75%),
                linear-gradient(45deg, rgba(255, 255, 255, 0.025) 25%, transparent 25% 75%, rgba(255, 255, 255, 0.025) 75%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
            transition: background-color 0.6s steps(6);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* CRT scanlines */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9000;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.06) 0 1px, transparent 1px 4px);
        }

        canvas,
        .pixel {
            image-rendering: pixelated;
        }

        .app {
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr);
            grid-template-rows: auto minmax(0, 1fr);
            gap: 14px;
            padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        }

        /* ---------- pixel primitives ---------- */
        .px-panel {
            background: var(--panel);
            border: var(--px) solid var(--ink);
            box-shadow: inset var(--px) var(--px) 0 rgba(255, 255, 255, 0.07), var(--px) var(--px) 0 var(--ink);
        }

        .px-btn {
            font: inherit;
            color: var(--text);
            background: var(--panel-hi);
            border: var(--px) solid var(--ink);
            box-shadow: inset calc(var(--px) * -1) calc(var(--px) * -1) 0 rgba(0, 0, 0, 0.45), inset var(--px) var(--px) 0 rgba(255, 255, 255, 0.16), var(--px) var(--px) 0 var(--ink);
            cursor: pointer;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 36px;
            padding: 6px 10px;
        }

        .px-btn:hover {
            background: #3a3f4a;
        }

        .px-btn:active {
            transform: translate(var(--px), var(--px));
            box-shadow: inset var(--px) var(--px) 0 rgba(0, 0, 0, 0.45);
        }

        .px-btn:focus-visible,
        .track:focus-visible,
        input:focus-visible {
            outline: var(--px) solid var(--hi);
            outline-offset: 2px;
        }

        .px-btn img {
            width: 18px;
            height: 18px;
            image-rendering: pixelated;
            pointer-events: none;
        }

        /* ---------- header ---------- */
        .top {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 14px;
            padding-left: 120px; /* room for the HOME button */
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .logo h1 {
            font-size: 18px;
            letter-spacing: 1px;
            text-shadow: var(--px) var(--px) 0 var(--ink);
        }

        .logo h1 b {
            color: var(--hi);
        }

        .shapes {
            display: flex;
            gap: 3px;
        }

        .shapes img {
            width: 14px;
            height: 14px;
        }

        .search-row {
            flex: 1;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            min-width: 0;
        }

        #searchBox {
            flex: 1;
            max-width: 360px;
            min-width: 0;
            font: inherit;
            color: var(--text);
            background: #0f1013;
            border: var(--px) solid var(--ink);
            box-shadow: inset var(--px) var(--px) 0 rgba(0, 0, 0, 0.6);
            padding: 10px;
            outline: none;
        }

        #searchBox::placeholder {
            color: var(--muted);
        }

        .tabs {
            display: flex;
            gap: 6px;
        }

        .tab.active {
            background: var(--hi);
            color: var(--ink);
        }

        /* ---------- deck (player) ---------- */
        .deck {
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 14px;
            position: relative;
        }

        .device-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .device {
            position: relative;
            height: 100%;
            max-height: 460px;
            aspect-ratio: 1;
            max-width: 100%;
        }

        .device canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.45s steps(6), opacity 0.3s steps(3);
        }

        .device canvas.slide-down {
            transform: translateY(120%);
            opacity: 0;
        }

        .loader {
            position: absolute;
            top: 6%;
            right: 6%;
            z-index: 10;
            font-size: 10px;
            color: var(--hi);
            background: var(--ink);
            padding: 4px 6px;
            animation: blink 0.6s steps(2) infinite;
        }

        .loader.hidden {
            display: none;
        }

        #visualizer {
            width: 100%;
            height: 34px;
            flex: none;
        }

        .now {
            width: 100%;
            text-align: center;
            flex: none;
        }

        .np-title {
            overflow: hidden;
            white-space: nowrap;
            font-size: 16px;
            color: var(--hi);
            text-shadow: 2px 2px 0 var(--ink);
        }

        .np-title span {
            display: inline-block;
        }

        .np-title.scroll span {
            padding-left: 100%;
            animation: marquee 14s linear infinite;
        }

        @keyframes marquee {
            to {
                transform: translateX(-100%);
            }
        }

        .np-artist {
            color: var(--muted);
            font-size: 11px;
            margin-top: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: none;
            font-variant-numeric: tabular-nums;
        }

        /* chunky segmented range sliders */
        input[type=range].px-range {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 16px;
            background:
                linear-gradient(90deg, var(--hi) 0 var(--fill, 0%), transparent var(--fill, 0%)),
                repeating-linear-gradient(90deg, #0f1013 0 6px, #2a2d35 6px 8px);
            border: var(--px) solid var(--ink);
            cursor: pointer;
            touch-action: none;
        }

        input[type=range].px-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 22px;
            background: var(--text);
            border: var(--px) solid var(--ink);
        }

        input[type=range].px-range::-moz-range-thumb {
            width: 8px;
            height: 18px;
            background: var(--text);
            border: var(--px) solid var(--ink);
            border-radius: 0;
        }

        .transport {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: none;
        }

        .transport .px-btn {
            width: 52px;
            height: 48px;
        }

        .transport .play {
            width: 72px;
            height: 60px;
            background: var(--hi);
        }

        .transport .play img {
            width: 26px;
            height: 26px;
        }

        .face {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            flex: none;
        }

        .face .px-btn {
            font-size: 10px;
            gap: 6px;
        }

        .face .px-btn.on {
            background: #3a3f4a;
            box-shadow: inset var(--px) var(--px) 0 rgba(0, 0, 0, 0.55);
            transform: translate(var(--px), var(--px));
        }

        .face .px-btn.on span {
            color: var(--hi);
        }

        .volume {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volume .px-range {
            width: 90px;
            flex: none;
        }

        .volume .px-btn {
            min-height: 30px;
            padding: 4px 6px;
        }

        /* ---------- library ---------- */
        .library {
            min-height: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .lib-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 12px 14px 8px;
            color: var(--muted);
            font-size: 10px;
        }

        .lib-head b {
            color: var(--tri);
            font-size: 12px;
        }

        .genre-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 14px 8px;
        }

        .genre-filters:empty {
            display: none;
        }

        .genre-filters .px-btn {
            font-size: 10px;
            min-height: 28px;
            padding: 4px 8px;
        }

        .genre-filters .px-btn.active {
            background: var(--tri);
            color: var(--ink);
        }

        .list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 4px 14px 14px;
            scrollbar-color: #444 transparent;
        }

        .status-msg {
            padding: 24px 10px;
            text-align: center;
            color: var(--muted);
            line-height: 2;
        }

        /* each track is a little memory-card plate */
        .track {
            position: relative;
            width: 100%;
            display: grid;
            grid-template-columns: 56px minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            padding: 8px 10px 8px 8px;
            margin-bottom: 10px;
            font: inherit;
            text-align: left;
            color: var(--ink);
            background: linear-gradient(180deg, #e2e2e8 0 50%, var(--plate) 50%);
            border: var(--px) solid var(--ink);
            box-shadow: inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--plate-dk), inset var(--px) var(--px) 0 #fff, var(--px) var(--px) 0 var(--ink);
            cursor: pointer;
            touch-action: manipulation;
        }

        .track:hover {
            background: linear-gradient(180deg, #f0f0f4 0 50%, #d8d8de 50%);
        }

        .track canvas {
            width: 56px;
            height: 56px;
        }

        .track.active canvas {
            animation: spin 1.6s steps(8) infinite;
        }

        .track.active.paused canvas {
            animation-play-state: paused;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .t-info {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .t-title,
        .t-artist,
        .t-album {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .t-title {
            font-size: 13px;
        }

        .t-artist {
            font-size: 10px;
            color: #3a3d45;
        }

        .t-album {
            font-size: 9px;
            color: #5c606a;
        }

        .t-badge {
            font-size: 9px;
            padding: 3px 4px;
            background: var(--ink);
            color: var(--text);
        }

        .track.active {
            background: linear-gradient(180deg, #fff2b0 0 50%, var(--hi) 50%);
            box-shadow: inset calc(var(--px) * -1) calc(var(--px) * -1) 0 #c79b00, inset var(--px) var(--px) 0 #fff, var(--px) var(--px) 0 var(--ink);
        }

        .track.active::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            border: 6px solid transparent;
            border-left-color: var(--hi);
            transform: translateY(-50%);
            animation: blink 0.8s steps(2) infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.2;
            }
        }

        /* ---------- lyrics ---------- */
        .lyrics-panel {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            background: rgba(13, 13, 13, 0.96);
        }

        .lyrics-panel.hidden {
            display: none;
        }

        .lyrics-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: var(--px) solid var(--ink);
        }

        #lyricsSongTitle {
            flex: 1;
            min-width: 0;
            font-size: 12px;
            color: var(--sqr);
            line-height: 1.6;
        }

        #lyricsContent {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            font: 11px/2.2 var(--font);
            white-space: pre-line;
            color: #ddd;
        }

        /* ---------- toast + hints ---------- */
        #nowPlayingToast {
            position: fixed;
            left: 50%;
            bottom: max(16px, env(safe-area-inset-bottom));
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: min(420px, 92vw);
            padding: 10px 14px;
            transform: translate(-50%, 160%);
            transition: transform 0.3s steps(5);
            pointer-events: none;
        }

        #nowPlayingToast.show {
            transform: translate(-50%, 0);
        }

        #toastImg {
            width: 40px;
            height: 40px;
            flex: none;
        }

        .toast-text {
            min-width: 0;
        }

        .toast-label {
            font-size: 9px;
            color: var(--tri);
            margin-bottom: 4px;
        }

        #toastTitle,
        #toastArtist {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #toastArtist {
            font-size: 10px;
            color: var(--muted);
            margin-top: 4px;
        }

        .hints {
            position: absolute;
            left: 14px;
            top: 14px;
            font-size: 9px;
            line-height: 2;
            color: rgba(255, 255, 255, 0.28);
            pointer-events: none;
        }

        /* ---------- phones ---------- */
        /* phones: the player stays put and only the track list scrolls; the
           shuffle / repeat / mute / lyrics buttons become an icon column
           beside the device */
        @media (max-width: 900px) {
            .app {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto auto minmax(0, 1fr);
                gap: 8px;
                padding-top: max(10px, env(safe-area-inset-top));
            }

            .top {
                flex-wrap: wrap;
                padding-left: 0;
                padding-top: 46px; /* HOME button sits above */
                gap: 8px;
            }

            .logo h1 {
                font-size: 14px;
            }

            .search-row {
                flex-basis: 100%;
                min-width: 0;
            }

            .tabs .px-btn {
                padding: 6px 8px;
            }

            #searchBox {
                max-width: none;
            }

            .deck {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                grid-template-areas:
                    "device face"
                    "vis vis"
                    "now now"
                    "progress progress"
                    "transport transport";
                align-items: center;
                padding: 10px;
                gap: 8px;
            }

            .device-wrap {
                grid-area: device;
                flex: none;
                height: min(24vh, 210px);
            }

            .face {
                grid-area: face;
                flex-direction: column;
                flex-wrap: nowrap;
                gap: 8px;
            }

            .face .px-btn {
                width: 46px;
                height: 42px;
                min-height: 0;
                padding: 0;
            }

            .face .px-btn span,
            .hints,
            .volume {
                display: none;
            }

            .face .px-btn img {
                width: 20px;
                height: 20px;
            }

            #visualizer {
                grid-area: vis;
                height: 22px;
            }

            .now {
                grid-area: now;
            }

            .progress {
                grid-area: progress;
            }

            .transport {
                grid-area: transport;
                justify-self: center;
            }

            .transport .px-btn {
                width: 50px;
                height: 44px;
            }

            .transport .play {
                width: 66px;
                height: 52px;
            }

            .np-title {
                font-size: 14px;
            }

            .lib-head {
                padding: 10px 12px 6px;
            }

            .list {
                padding: 4px 12px 12px;
            }

            .track {
                grid-template-columns: 44px minmax(0, 1fr) auto;
                gap: 10px;
                padding: 6px 8px 6px 6px;
                margin-bottom: 8px;
            }

            .track canvas {
                width: 44px;
                height: 44px;
            }

            .t-title {
                font-size: 12px;
            }
        }

        /* short phones: shrink the device and drop the visualizer so the list
           keeps some room */
        @media (max-width: 900px) and (max-height: 720px) {
            .device-wrap {
                height: min(19vh, 150px);
            }

            .face {
                gap: 4px;
            }

            .face .px-btn {
                height: 34px;
            }

            #visualizer {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <script src="../../pixel-transition.js"></script>
    <script src="../../offline.js"></script>
    <script>PixelTransition.reveal();</script>
    <script src="../../site-nav.js" data-home="../../index.html"></script>

    <div class="app">
        <header class="top">
            <div class="logo">
                <div class="shapes" aria-hidden="true">
                    <img class="pixel" data-icon="tri" alt=""><img class="pixel" data-icon="cir" alt=""><img class="pixel" data-icon="crs" alt=""><img class="pixel" data-icon="sqr" alt="">
                </div>
                <h1>PS <b>PLAYER</b></h1>
            </div>
            <div class="search-row">
                <input type="text" id="searchBox" placeholder="SEARCH..." aria-label="Search songs" autocomplete="off">
                <div class="tabs" role="tablist" aria-label="Library source">
                    <button class="px-btn tab active" id="localModeBtn" role="tab" aria-selected="true">LOCAL</button>
                    <button class="px-btn tab" id="itunesModeBtn" role="tab" aria-selected="false">ITUNES</button>
                </div>
            </div>
        </header>

        <section class="deck px-panel" aria-label="Player">
            <div class="hints" aria-hidden="true">SPACE PLAY<br>LEFT/RIGHT SKIP<br>UP/DOWN VOLUME<br>S SHUFFLE R REPEAT<br>L LYRICS M MUTE</div>
            <div class="device-wrap">
                <div class="device" id="device">
                    <canvas id="layer5" width="160" height="160"></canvas>
                    <canvas id="layer4" width="160" height="160"></canvas>
                    <canvas id="disk" width="160" height="160"></canvas>
                    <canvas id="layer3" width="160" height="160"></canvas>
                    <canvas id="layer2" width="160" height="160"></canvas>
                    <canvas id="layer1" width="160" height="160"></canvas>
                    <div id="loader" class="loader hidden">LOADING</div>
                </div>
            </div>
            <canvas id="visualizer" width="96" height="12" aria-hidden="true"></canvas>
            <div class="now" aria-live="polite">
                <div class="np-title" id="npTitle"><span>-</span></div>
                <div class="np-artist" id="npArtist">&nbsp;</div>
            </div>
            <div class="progress">
                <span id="currentTimeDisplay">0:00</span>
                <input type="range" class="px-range" id="progressSlider" min="0" max="100" value="0" step="0.1" aria-label="Seek">
                <span id="durationDisplay">0:00</span>
            </div>
            <div class="transport">
                <button class="px-btn" id="prevBtn" title="Previous (Left arrow)" aria-label="Previous"><img data-icon="prev" alt=""></button>
                <button class="px-btn play" id="playPauseBtn" title="Play / Pause (Space)" aria-label="Play"><img id="playPauseIcon" data-icon="play" alt=""></button>
                <button class="px-btn" id="nextBtn" title="Next (Right arrow)" aria-label="Next"><img data-icon="next" alt=""></button>
            </div>
            <div class="face">
                <button class="px-btn" id="shuffleBtn" aria-label="Shuffle" aria-pressed="false" title="Shuffle (S)"><img data-icon="tri" alt=""><span>SHUFFLE</span></button>
                <button class="px-btn" id="repeatBtn" aria-label="Repeat" aria-pressed="false" title="Repeat (R)"><img data-icon="cir" alt=""><span>REPEAT</span></button>
                <button class="px-btn" id="muteBtn" aria-label="Mute" aria-pressed="false" title="Mute (M)"><img data-icon="crs" alt=""><span>MUTE</span></button>
                <button class="px-btn" id="lyricsBtn" aria-label="Lyrics" aria-pressed="false" title="Lyrics (L)"><img data-icon="sqr" alt=""><span>LYRICS</span></button>
                <div class="volume">
                    <button class="px-btn" id="volDownBtn" aria-label="Volume down"><img data-icon="voldown" alt=""></button>
                    <input type="range" class="px-range" id="volumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Volume">
                    <button class="px-btn" id="volUpBtn" aria-label="Volume up"><img data-icon="volup" alt=""></button>
                </div>
            </div>
        </section>

        <section class="library px-panel" aria-label="Library">
            <div class="lib-head"><b id="libTitle">MEMORY CARD 1</b><span id="libCount"></span></div>
            <div id="genreFilters" class="genre-filters"></div>
            <div class="list" id="list">
                <div id="itunesLoader" class="status-msg" hidden>SEARCHING ITUNES...</div>
                <div id="musicList" role="list"></div>
            </div>
            <div id="lyricsPanel" class="lyrics-panel hidden" role="dialog" aria-label="Lyrics">
                <div class="lyrics-header">
                    <h3 id="lyricsSongTitle">LYRICS</h3>
                    <button class="px-btn" id="closeLyricsBtn" aria-label="Close lyrics"><img data-icon="crs" alt=""></button>
                </div>
                <pre id="lyricsContent">LOADING...</pre>
            </div>
        </section>
    </div>

    <div id="nowPlayingToast" class="px-panel" role="status">
        <canvas id="toastImg" width="32" height="32"></canvas>
        <div class="toast-text">
            <div class="toast-label">NOW PLAYING</div>
            <div id="toastTitle"></div>
            <div id="toastArtist"></div>
        </div>
    </div>

    <!-- local files go through Web Audio (visualizer); iTunes previews are
         cross-origin, so they play on their own element that is never routed
         through Web Audio (that would silence them) -->
    <audio id="audio" preload="none"></audio>
    <audio id="remoteAudio" preload="none"></audio>
    <script src="playlist.js"></script>
    <script>
        'use strict';
        // ==================================================================
        // Pixel icons (9x9 maps) rendered to data URLs
        // ==================================================================
        const ICON_MAPS = {
            play: ['.k.......', '.kk......', '.kkk.....', '.kkkk....', '.kkkkk...', '.kkkk....', '.kkk.....', '.kk......', '.k.......'],
            pause: ['.........', '.kk..kk..', '.kk..kk..', '.kk..kk..', '.kk..kk..', '.kk..kk..', '.kk..kk..', '.kk..kk..', '.........'],
            prev: ['.........', 'w...w...w', 'w..ww..ww', 'w.www.www', 'wwwwwwwww', 'w.www.www', 'w..ww..ww', 'w...w...w', '.........'],
            next: ['.........', 'w...w...w', 'ww..ww..w', 'www.www.w', 'wwwwwwwww', 'www.www.w', 'ww..ww..w', 'w...w...w', '.........'],
            tri: ['....g....', '...ggg...', '...g.g...', '..gg.gg..', '..g...g..', '.gg...gg.', '.g.....g.', 'ggggggggg', '.........'],
            cir: ['..rrrrr..', '.rr...rr.', 'rr.....rr', 'r.......r', 'r.......r', 'r.......r', 'rr.....rr', '.rr...rr.', '..rrrrr..'],
            crs: ['bb.....bb', 'bbb...bbb', '.bbb.bbb.', '..bbbbb..', '...bbb...', '..bbbbb..', '.bbb.bbb.', 'bbb...bbb', 'bb.....bb'],
            sqr: ['ppppppppp', 'p.......p', 'p.......p', 'p.......p', 'p.......p', 'p.......p', 'p.......p', 'p.......p', 'ppppppppp'],
            voldown: ['.........', '....w....', '...ww....', 'wwwww....', 'wwwww.www', 'wwwww....', '...ww....', '....w....', '.........'],
            volup: ['.........', '....w..w.', '...ww..w.', 'wwwww.www', 'wwwww..w.', 'wwwww....', '...ww....', '....w....', '.........'],
        };
        const ICON_PAL = { k: '#0d0d0d', w: '#f4f1e8', g: '#3ddc84', r: '#ff4d6d', b: '#5aa9ff', p: '#ff7ad9' };
        const ICONS = {};
        for (const [name, rows] of Object.entries(ICON_MAPS)) {
            const c = document.createElement('canvas');
            c.width = c.height = 9;
            const g = c.getContext('2d');
            rows.forEach((row, y) => [...row].forEach((ch, x) => {
                if (ICON_PAL[ch]) { g.fillStyle = ICON_PAL[ch]; g.fillRect(x, y, 1, 1); }
            }));
            ICONS[name] = c.toDataURL();
        }
        document.querySelectorAll('img[data-icon]').forEach(img => { img.src = ICONS[img.dataset.icon]; img.classList.add('pixel'); });

        // ==================================================================
        // Pixel-art conversion (same idea as the effect studio): downscale,
        // hard-edge the alpha and posterize with a 4x4 ordered dither.
        // ==================================================================
        const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - 0.5);
        function loadImage(url, cors) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                if (cors) img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }
        async function loadAnyImage(url) {
            const remote = /^https?:/i.test(url) && !url.startsWith(location.origin);
            try { return await loadImage(url, remote); }
            catch { if (remote) return loadImage(url, false); throw new Error('image failed'); }
        }
        // returns a size x size canvas (or null if the image can't load)
        async function pixelate(url, size, { levels = 6, fit = 'cover' } = {}) {
            const c = document.createElement('canvas');
            c.width = c.height = size;
            const g = c.getContext('2d');
            let img;
            try { img = await loadAnyImage(url); } catch { return null; }
            const s = fit === 'cover' ? Math.max(size / img.width, size / img.height) : Math.min(size / img.width, size / img.height);
            const w = img.width * s, h = img.height * s;
            g.imageSmoothingQuality = 'high';
            g.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
            try {
                const d = g.getImageData(0, 0, size, size);
                const px = d.data, step = 255 / (levels - 1);
                for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
                    const i = (y * size + x) * 4;
                    if (px[i + 3] < 128) { px[i + 3] = 0; continue; }
                    px[i + 3] = 255;
                    const t = BAYER[(y & 3) * 4 + (x & 3)] * step;
                    for (let k = 0; k < 3; k++) px[i + k] = Math.max(0, Math.min(255, Math.round((px[i + k] + t) / step) * step));
                }
                g.putImageData(d, 0, 0);
            } catch { /* cross-origin art without CORS: keep the plain downscale */ }
            return c;
        }

        // ==================================================================
        // DOM + state
        // ==================================================================
        const $ = id => document.getElementById(id);
        const localAudio = $('audio'), remoteAudio = $('remoteAudio');
        const musicListEl = $('musicList'), searchBox = $('searchBox');
        const progressSlider = $('progressSlider'), volumeSlider = $('volumeSlider');
        const lyricsPanel = $('lyricsPanel');
        const DEV = 160;
        const ART = './ps_player_images/';
        const DEFAULT_DISK = ART + 'ps_default_disk_00.webp';

        let playlist = [], currentSong = 0, isPlaying = false;
        let isShuffling = false, isRepeating = false, isItunesMode = false;
        let currentGenreFilter = 'All', toastTimer = 0;
        let audio = localAudio;
        const wait = ms => new Promise(r => setTimeout(r, ms));

        function setFill(range) {
            const min = +range.min, max = +range.max;
            range.style.setProperty('--fill', ((range.value - min) / (max - min) * 100) + '%');
        }

        // ==================================================================
        // The PlayStation device: pixelated layers + a rotating pixel disc
        // ==================================================================
        const layers = { layer1: 'ps_front_cover.webp', layer2: 'ps_disk_cover.webp', layer3: 'cover_image_outter_part.png', layer4: 'ps_empty_disk.webp', layer5: 'ps_disk_back.webp' };
        let diskMask = null, diskArt = null, diskAngle = 0, diskRaf = 0, lastDiskFrame = 0;
        const diskCanvas = $('disk'), diskCtx = diskCanvas.getContext('2d');

        async function initDevice() {
            await Promise.all(Object.entries(layers).map(async ([id, file]) => {
                const c = await pixelate(ART + file, DEV, { levels: 7, fit: 'contain' });
                if (c) $(id).getContext('2d').drawImage(c, 0, 0);
            }));
            diskMask = await pixelate(DEFAULT_DISK, DEV, { levels: 7, fit: 'contain' });
        }

        // cover art clipped to the disc shape
        async function setDiskArt(url) {
            const art = await pixelate(url, DEV, { levels: 6, fit: 'cover' }) || diskMask;
            const c = document.createElement('canvas');
            c.width = c.height = DEV;
            const g = c.getContext('2d');
            if (art) g.drawImage(art, 0, 0);
            if (diskMask) {
                g.globalCompositeOperation = 'destination-in';
                g.drawImage(diskMask, 0, 0);
            }
            diskArt = c;
            drawDisk();
        }

        // rotate in the low-res canvas with nearest-neighbour sampling so it
        // stays chunky pixel art instead of a smoothly rotated image
        function drawDisk() {
            diskCtx.clearRect(0, 0, DEV, DEV);
            if (!diskArt) return;
            diskCtx.save();
            diskCtx.imageSmoothingEnabled = false;
            diskCtx.translate(DEV / 2, DEV / 2);
            diskCtx.rotate(diskAngle);
            diskCtx.drawImage(diskArt, -DEV / 2, -DEV / 2);
            diskCtx.restore();
        }

        function spinDisk(on) {
            cancelAnimationFrame(diskRaf);
            if (!on) return;
            const tick = t => {
                diskRaf = requestAnimationFrame(tick);
                if (t - lastDiskFrame < 1000 / 15) return; // 15 fps, retro
                lastDiskFrame = t;
                diskAngle += Math.PI / 24;
                drawDisk();
            };
            diskRaf = requestAnimationFrame(tick);
        }

        // ==================================================================
        // Visualizer (real data for local tracks — see the note on the audio
        // tags; iTunes previews get a fake bounce)
        // ==================================================================
        let audioCtx = null, analyser = null;
        const vis = $('visualizer'), visCtx = vis.getContext('2d');
        function initAudioCtx() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                const src = audioCtx.createMediaElementSource(localAudio);
                src.connect(analyser);
                analyser.connect(audioCtx.destination);
            } catch { analyser = null; }
        }
        const visBuf = new Uint8Array(32);
        function drawVis() {
            requestAnimationFrame(drawVis);
            if (document.hidden) return;
            const W = vis.width, H = vis.height;
            visCtx.clearRect(0, 0, W, H);
            const bars = 24, bw = W / bars;
            const live = analyser && audio === localAudio && isPlaying;
            if (live) analyser.getByteFrequencyData(visBuf);
            for (let i = 0; i < bars; i++) {
                const v = live ? visBuf[i] / 255 : (isPlaying ? (Math.sin(performance.now() / 180 + i) + 1) / 4 : 0.04);
                const h = Math.max(1, Math.round(v * H));
                for (let y = 0; y < h; y++) {
                    visCtx.fillStyle = y > H * 0.75 ? '#ff4d6d' : y > H * 0.45 ? '#ffd23f' : '#3ddc84';
                    visCtx.fillRect(i * bw + 1, H - 1 - y, bw - 2, 1);
                }
            }
        }

        // ==================================================================
        // Background tint from the cover
        // ==================================================================
        function tintFrom(canvas) {
            try {
                const d = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
                let r = 0, g = 0, b = 0, n = 0;
                for (let i = 0; i < d.length; i += 16) {
                    if (d[i + 3] < 128) continue;
                    const br = (d[i] + d[i + 1] + d[i + 2]) / 3;
                    if (br > 25 && br < 225) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
                }
                if (n) document.body.style.setProperty('--bg', `rgb(${~~(r / n * .3)},${~~(g / n * .3)},${~~(b / n * .3)})`);
            } catch { }
        }

        // ==================================================================
        // Lyrics
        // ==================================================================
        async function fetchLyrics(artist, title) {
            try {
                const res = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`);
                if (!res.ok) return null;
                return (await res.json()).lyrics || null;
            } catch { return null; }
        }
        function showLyrics() {
            const s = playlist[currentSong];
            if (!s) return;
            lyricsPanel.classList.remove('hidden');
            setToggle($('lyricsBtn'), true);
            $('lyricsSongTitle').textContent = `${s.title} - ${s.artist}`;
            $('lyricsContent').textContent = 'LOADING...';
            fetchLyrics(s.artist, s.title).then(txt => { $('lyricsContent').textContent = txt || 'NO LYRICS FOUND FOR THIS SONG.'; });
        }
        function hideLyrics() {
            lyricsPanel.classList.add('hidden');
            setToggle($('lyricsBtn'), false);
        }

        // ==================================================================
        // Toast + now playing
        // ==================================================================
        function setNowPlaying(s) {
            const t = $('npTitle');
            t.classList.remove('scroll');
            t.firstChild.textContent = s ? s.title : '-';
            t.classList.toggle('scroll', !!s && t.firstChild.offsetWidth > t.clientWidth);
            $('npArtist').textContent = s ? `${s.artist}${s.album ? ' / ' + s.album : ''}` : '';
        }
        function showToast(s, thumb) {
            $('toastTitle').textContent = s.title;
            $('toastArtist').textContent = s.artist;
            const g = $('toastImg').getContext('2d');
            g.clearRect(0, 0, 32, 32);
            if (thumb) g.drawImage(thumb, 0, 0, 32, 32);
            $('nowPlayingToast').classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => $('nowPlayingToast').classList.remove('show'), 3200);
        }

        // ==================================================================
        // Library
        // ==================================================================
        const thumbs = new Map();
        function thumbFor(s) {
            if (!thumbs.has(s.diskImage)) thumbs.set(s.diskImage, pixelate(s.diskImage, 32, { levels: 5 }).then(c => c || pixelate(DEFAULT_DISK, 32, { levels: 5, fit: 'contain' })));
            return thumbs.get(s.diskImage);
        }

        function buildGenreFilters() {
            const box = $('genreFilters');
            box.innerHTML = '';
            const genres = [...new Set(playlist.map(s => s.genre || 'Other'))];
            if (genres.length < 2) return; // nothing to filter by
            ['All', ...genres].forEach(gname => {
                const b = document.createElement('button');
                b.className = 'px-btn' + (gname === currentGenreFilter ? ' active' : '');
                b.textContent = gname.toUpperCase();
                b.onclick = () => {
                    currentGenreFilter = gname;
                    box.querySelectorAll('.px-btn').forEach(p => p.classList.toggle('active', p === b));
                    applyFilters();
                };
                box.appendChild(b);
            });
        }

        function applyFilters() {
            const q = isItunesMode ? '' : searchBox.value.toLowerCase();
            let shown = 0;
            [...musicListEl.children].forEach((el, i) => {
                const s = playlist[i];
                if (!s || !el.classList.contains('track')) return;
                const ok = (currentGenreFilter === 'All' || (s.genre || 'Other') === currentGenreFilter) &&
                    `${s.title} ${s.artist} ${s.album}`.toLowerCase().includes(q);
                el.hidden = !ok;
                if (ok) shown++;
            });
            $('libCount').textContent = `${shown} SONG${shown === 1 ? '' : 'S'}`;
        }

        function statusMsg(html) {
            musicListEl.innerHTML = `<div class="status-msg">${html}</div>`;
            $('libCount').textContent = '';
        }

        function buildList() {
            musicListEl.innerHTML = '';
            playlist.forEach((s, i) => {
                const b = document.createElement('button');
                b.className = 'track';
                b.setAttribute('role', 'listitem');
                const cv = document.createElement('canvas');
                cv.width = cv.height = 32;
                thumbFor(s).then(t => t && cv.getContext('2d').drawImage(t, 0, 0));
                const info = document.createElement('span');
                info.className = 't-info';
                [['t-title', s.title], ['t-artist', s.artist], ['t-album', s.album || '-']].forEach(([cls, txt]) => {
                    const sp = document.createElement('span');
                    sp.className = cls;
                    sp.textContent = txt;
                    info.appendChild(sp);
                });
                const badge = document.createElement('span');
                badge.className = 't-badge';
                badge.textContent = s.isItunes ? '30S' : String(i + 1).padStart(2, '0');
                b.append(cv, info, badge);
                b.addEventListener('click', () => {
                    if (i !== currentSong) transitionTo(i).then(playSong);
                    else isPlaying ? pauseSong() : playSong();
                });
                musicListEl.appendChild(b);
            });
            $('libTitle').textContent = isItunesMode ? 'ITUNES PREVIEWS' : 'MEMORY CARD 1';
            highlightActive();
            applyFilters();
        }

        function highlightActive() {
            [...musicListEl.children].forEach((el, i) => {
                el.classList.toggle('active', i === currentSong);
                el.classList.toggle('paused', i === currentSong && !isPlaying);
            });
        }

        function scrollToActive() {
            musicListEl.querySelector('.track.active')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // ==================================================================
        // Playback
        // ==================================================================
        function formatTime(s) {
            if (!isFinite(s)) return '0:00';
            const m = Math.floor(s / 60), sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        async function initPlaylist() {
            currentSong = 0;
            if (typeof hardcodedMusicData === 'undefined' || !hardcodedMusicData.length) return statusMsg('PLAYLIST IS EMPTY.');
            playlist = hardcodedMusicData.map(s => {
                const base = s.filename.substring(s.filename.lastIndexOf('/') + 1).replace(/\.[^/.]+$/, '');
                return {
                    src: s.filename,
                    diskImage: `music/cover/${base}.webp`,
                    title: s.title || base.replace(/_/g, ' '),
                    artist: s.artist || 'Unknown Artist',
                    album: s.album || '',
                    genre: s.genre || 'Other',
                    isItunes: false,
                };
            });
            buildList();
            buildGenreFilters();
            await loadSong(0);
        }

        async function loadSong(idx) {
            const s = playlist[idx];
            if (!s) return;
            currentSong = idx;
            const next = s.isItunes ? remoteAudio : localAudio;
            if (next !== audio) audio.pause();
            audio = next;
            audio.src = s.src ? (s.isItunes ? s.src : encodeURI(s.src).replace(/#/g, '%23')) : '';
            audio.load();
            highlightActive();
            $('durationDisplay').textContent = '0:00';
            $('currentTimeDisplay').textContent = '0:00';
            progressSlider.value = 0;
            setFill(progressSlider);
            setNowPlaying(s);
            diskAngle = 0;
            await setDiskArt(s.diskImage);
            thumbFor(s).then(t => t && tintFrom(t));
            setTimeout(scrollToActive, 120);
            if (!lyricsPanel.classList.contains('hidden')) showLyrics();
        }

        function updateIcon() {
            $('playPauseIcon').src = isPlaying ? ICONS.pause : ICONS.play;
            $('playPauseBtn').setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
        }

        function playSong() {
            const s = playlist[currentSong];
            if (!s?.src) return;
            if (!s.isItunes) {
                initAudioCtx();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }
            audio.play().then(() => {
                isPlaying = true;
                spinDisk(true);
                updateIcon();
                highlightActive();
                thumbFor(s).then(t => showToast(s, t));
            }).catch(e => { console.warn('Playback blocked:', e); isPlaying = false; updateIcon(); });
        }

        function pauseSong() {
            audio.pause();
            isPlaying = false;
            spinDisk(false);
            updateIcon();
            highlightActive();
        }

        // swap animation: the lid slides away, the disc drops out, the new
        // disc slides in, the lid closes again
        let switching = false;
        async function transitionTo(idx) {
            if (switching) return;
            switching = true;
            pauseSong();
            const lid = $('layer2'), parts = [$('layer4'), $('layer3'), diskCanvas];
            lid.classList.add('slide-down');
            await wait(160);
            parts.forEach(el => el.classList.add('slide-down'));
            await wait(320);
            await loadSong(idx);
            parts.forEach(el => el.classList.remove('slide-down'));
            await wait(320);
            lid.classList.remove('slide-down');
            await wait(300);
            switching = false;
        }

        function nextSong() {
            if (!playlist.length) return;
            let n = isShuffling ? Math.floor(Math.random() * playlist.length) : (currentSong + 1) % playlist.length;
            if (isShuffling && n === currentSong && playlist.length > 1) n = (currentSong + 1) % playlist.length;
            transitionTo(n).then(playSong);
        }
        function prevSong() {
            if (!playlist.length) return;
            transitionTo((currentSong - 1 + playlist.length) % playlist.length).then(playSong);
        }

        // ==================================================================
        // iTunes search (30 second previews)
        // ==================================================================
        let itunesTimer = 0;
        async function searchItunes(q) {
            if (!q.trim()) return;
            $('itunesLoader').hidden = false;
            musicListEl.innerHTML = '';
            $('genreFilters').innerHTML = '';
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&limit=25&entity=song`);
                const data = await res.json();
                const results = (data.results || []).filter(t => t.previewUrl);
                if (results.length) {
                    playlist = results.map(t => ({
                        src: t.previewUrl,
                        diskImage: t.artworkUrl100 ? t.artworkUrl100.replace('100x100bb', '300x300bb') : DEFAULT_DISK,
                        title: t.trackName || 'Unknown',
                        artist: t.artistName || 'Unknown',
                        album: t.collectionName || '',
                        genre: t.primaryGenreName || 'Other',
                        isItunes: true,
                    }));
                    currentSong = 0;
                    buildList();
                    buildGenreFilters();
                    await loadSong(0);
                } else statusMsg('NO RESULTS FOUND.');
            } catch {
                statusMsg('SEARCH FAILED.<br>CHECK YOUR CONNECTION.');
            }
            $('itunesLoader').hidden = true;
        }

        // ==================================================================
        // Controls
        // ==================================================================
        function setToggle(btn, on) {
            btn.classList.toggle('on', on);
            btn.setAttribute('aria-pressed', String(on));
        }
        const toggleShuffle = () => { isShuffling = !isShuffling; setToggle($('shuffleBtn'), isShuffling); };
        const toggleRepeat = () => { isRepeating = !isRepeating; setToggle($('repeatBtn'), isRepeating); };
        const toggleMute = () => { localAudio.muted = remoteAudio.muted = !audio.muted; setToggle($('muteBtn'), audio.muted); };
        const toggleLyrics = () => lyricsPanel.classList.contains('hidden') ? showLyrics() : hideLyrics();
        function setVolume(v) {
            localAudio.volume = remoteAudio.volume = Math.max(0, Math.min(1, v));
            volumeSlider.value = audio.volume;
            setFill(volumeSlider);
        }

        $('playPauseBtn').addEventListener('click', () => isPlaying ? pauseSong() : playSong());
        $('prevBtn').addEventListener('click', prevSong);
        $('nextBtn').addEventListener('click', nextSong);
        $('shuffleBtn').addEventListener('click', toggleShuffle);
        $('repeatBtn').addEventListener('click', toggleRepeat);
        $('muteBtn').addEventListener('click', toggleMute);
        $('lyricsBtn').addEventListener('click', toggleLyrics);
        $('closeLyricsBtn').addEventListener('click', hideLyrics);
        $('volUpBtn').addEventListener('click', () => setVolume(audio.volume + 0.1));
        $('volDownBtn').addEventListener('click', () => setVolume(audio.volume - 0.1));
        volumeSlider.addEventListener('input', e => setVolume(+e.target.value));
        progressSlider.addEventListener('input', e => {
            setFill(progressSlider);
            if (!audio.duration) return;
            audio.currentTime = +e.target.value / 100 * audio.duration;
            $('currentTimeDisplay').textContent = formatTime(audio.currentTime);
        });

        [localAudio, remoteAudio].forEach(a => {
            const live = () => a === audio;
            a.addEventListener('ended', () => { if (!live()) return; isRepeating ? (a.currentTime = 0, playSong()) : nextSong(); });
            a.addEventListener('timeupdate', () => {
                if (!live() || !a.duration) return;
                progressSlider.value = a.currentTime / a.duration * 100;
                setFill(progressSlider);
                $('currentTimeDisplay').textContent = formatTime(a.currentTime);
            });
            a.addEventListener('loadedmetadata', () => { if (live()) $('durationDisplay').textContent = formatTime(a.duration); });
            a.addEventListener('waiting', () => live() && $('loader').classList.remove('hidden'));
            ['playing', 'canplay', 'error', 'stalled', 'pause'].forEach(ev => a.addEventListener(ev, () => live() && $('loader').classList.add('hidden')));
        });

        searchBox.addEventListener('input', e => {
            const q = e.target.value;
            if (!isItunesMode) return applyFilters();
            clearTimeout(itunesTimer);
            if (!q.trim()) return statusMsg('TYPE TO SEARCH ITUNES.');
            itunesTimer = setTimeout(() => searchItunes(q), 600);
        });

        function setMode(itunes) {
            if (itunes === isItunesMode) return;
            if (isPlaying) pauseSong();
            isItunesMode = itunes;
            $('localModeBtn').classList.toggle('active', !itunes);
            $('itunesModeBtn').classList.toggle('active', itunes);
            $('localModeBtn').setAttribute('aria-selected', String(!itunes));
            $('itunesModeBtn').setAttribute('aria-selected', String(itunes));
            searchBox.placeholder = itunes ? 'SEARCH ITUNES...' : 'SEARCH...';
            searchBox.value = '';
            currentGenreFilter = 'All';
            hideLyrics();
            if (itunes) {
                $('genreFilters').innerHTML = '';
                $('libTitle').textContent = 'ITUNES PREVIEWS';
                statusMsg('TYPE TO SEARCH ITUNES.<br>EVERY SONG IS A 30S PREVIEW.');
                searchBox.focus();
            } else initPlaylist();
        }
        $('localModeBtn').addEventListener('click', () => setMode(false));
        $('itunesModeBtn').addEventListener('click', () => setMode(true));

        document.addEventListener('keydown', e => {
            if (e.target === searchBox) return;
            switch (e.code) {
                case 'Space': e.preventDefault(); isPlaying ? pauseSong() : playSong(); break;
                case 'ArrowRight': e.preventDefault(); nextSong(); break;
                case 'ArrowLeft': e.preventDefault(); prevSong(); break;
                case 'ArrowUp': e.preventDefault(); setVolume(audio.volume + 0.1); break;
                case 'ArrowDown': e.preventDefault(); setVolume(audio.volume - 0.1); break;
                case 'KeyL': toggleLyrics(); break;
                case 'KeyS': toggleShuffle(); break;
                case 'KeyR': toggleRepeat(); break;
                case 'KeyM': toggleMute(); break;
            }
        });

        window.addEventListener('resize', () => setNowPlaying(playlist[currentSong]));

        // ==================================================================
        // Boot
        // ==================================================================
        setFill(volumeSlider);
        setFill(progressSlider);
        drawVis();
        initDevice().then(initPlaylist);
    </script>
</body>

</html>
